/* ===================== Transcript =====================
   One session as turns: each prompt and everything the agent did until the
   next one, with what that turn cost. */
const PROMPT_PREVIEW = 600;

function turnPromptHTML(t) {
  if (t.kind === "start") return `<div class="turn-prompt none">Before the first prompt</div>`;
  if (t.kind === "automatic" || !t.prompt) return `<div class="turn-prompt none">Started automatically (no prompt typed)</div>`;
  const long = t.prompt.length > PROMPT_PREVIEW && !state.expanded.has(String(t.n));
  const text = long ? t.prompt.slice(0, PROMPT_PREVIEW).trimEnd() + "…" : t.prompt;
  return `<div class="turn-prompt ${t.kind === "command" ? "command" : ""}">${esc(text)}</div>` +
    (long ? `<button class="link-btn" data-expand="${t.n}">Show the whole prompt</button>` : "");
}

function turnHTML(t, max) {
  const when = t.started_at ? `${fullDate(t.started_at)}, ${clockTime(t.started_at)}` : "";
  const took = t.started_at && t.ended_at && t.ended_at > t.started_at ? ` · ${duration(t.ended_at - t.started_at)}` : "";
  const toks = t.input_tokens + t.output_tokens + t.cache_read_tokens + t.cache_write_tokens;
  const prompt = t.input_tokens + t.cache_read_tokens + t.cache_write_tokens;
  const meta = [
    t.models.join(", "),
    t.message_count ? `${int(t.message_count)} message${t.message_count === 1 ? "" : "s"}` : "no billed messages",
    toks ? `${tokens(toks)} tokens${prompt ? ` (${pct(t.cache_read_tokens / prompt * 100)} from cache)` : ""}` : "",
    t.subagent_messages ? `${int(t.subagent_messages)} by sub-agents` : "",
  ].filter(Boolean).join(" · ");
  const tools = t.tools.slice(0, 8).map(x => `<span class="chip">${esc(x.name.replace(/^mcp__[^_]+__/, ""))}${x.count > 1 ? ` ×${x.count}` : ""}</span>`).join("")
    + (t.tools.length > 8 ? `<span class="chip">+${t.tools.length - 8} more</span>` : "");
  const response = t.response ? `<details class="turn-response"><summary>Response</summary><div class="turn-response-body">${esc(t.response)}${t.response_chars > t.response.length ? `<span class="muted">\n\n… ${int(t.response_chars - t.response.length)} more characters</span>` : ""}</div></details>` : "";
  return `<div class="turn" id="turn-${t.n}">
    <div class="turn-head"><span class="turn-n">#${t.n}</span><span class="turn-when">${esc(when + took)}</span>
      <span class="turn-cost" ${tipAttr(tipRows("Turn #" + t.n, [...TOKEN_TYPES.map(([k, label], i) => [label, usd(t["cost_" + k]), SERIES[i]]), ["Total", usd(t.cost)]]))}>${usd(t.cost)}</span></div>
    <div class="turn-bar"><span data-w="${max ? t.cost / max * 100 : 0}%"></span></div>
    ${turnPromptHTML(t)}
    <div class="turn-meta">${esc(meta)}</div>
    ${tools ? `<div class="chips">${tools}</div>` : ""}
    ${response}
  </div>`;
}

views.transcript = () => {
  const back = `<button class="back-link" data-go="sessions">${icon("chevron", 'style="transform:rotate(90deg)"')}Sessions</button>`;
  const tr = state.transcript;
  if (!tr || tr.loading) return back + viewHead("Session", "") + `<div class="panel"><div class="empty-state">Reading the session log<span class="loading-dots"></span></div></div>`;
  if (tr.error) return back + viewHead("Session", "") + `<div class="panel"><div class="empty-state"><h3>Couldn't open this session</h3>${esc(tr.error)}</div></div>`;
  const s = normSession(tr.data.session);
  const name = sessionName(s);
  const all = tr.data.turns.map(t => ({ ...t, started_at: ms(t.started_at), ended_at: ms(t.ended_at) }));
  const carried = all.filter(t => t.carried_over);
  const turns = all.filter(t => !t.carried_over).map((t, i) => ({ ...t, n: i + 1 }));
  const max = Math.max(0, ...turns.map(t => t.cost));
  const top = turns.reduce((a, t) => (t.cost > (a?.cost ?? -1) ? t : a), null);
  const ordered = state.turnSort === "cost" ? [...turns].sort((a, b) => b.cost - a.cost) : turns;
  const models = s.models.split(",").filter(Boolean).join(", ");
  const sub = [`${glyph(s.source)}${SOURCE_LABEL[s.source]}`, esc(s.project || ""), s.start_ts ? esc(`${fullDate(s.start_ts)}, ${clockTime(s.start_ts)}`) : "",
    s.end_ts && s.start_ts ? esc(duration(s.end_ts - s.start_ts)) : "", esc(models)].filter(Boolean).join(" · ");
  const carriedRow = carried.length ? `<div class="carried"><span>${int(carried.length)} earlier turn${carried.length === 1 ? "" : "s"} carried over from the session this one was resumed from. Their cost is counted there.</span>
      <button class="link-btn" data-carried>${state.showCarried ? "Hide" : "Show"}</button></div>
      ${state.showCarried ? carried.map((t, i) => turnHTML({ ...t, n: "e" + (i + 1) }, max)).join("") : ""}` : "";
  return back + `<div class="view-head"><div style="min-width:0"><h1 class="transcript-title">${name.html}</h1><div class="sub transcript-sub">${sub}</div></div>
      <div class="transcript-total"><span class="big num">${usd(s.cost)}</span><button class="copy" data-copy="${esc(s.session_id)}" title="${esc(s.session_id)}">Copy session ID</button></div></div>
    <div class="panel eff four">
      <div><div class="stat-k">Turns</div><div class="stat-v">${int(turns.length)}</div><div class="stat-s">${carried.length ? `plus ${int(carried.length)} carried over` : "prompts you typed"}</div></div>
      <div><div class="stat-k">Per turn</div><div class="stat-v">${usd(turns.length ? s.cost / turns.length : 0)}</div><div class="stat-s">average</div></div>
      <div><div class="stat-k">Most expensive turn</div><div class="stat-v">${top ? usd(top.cost) : "—"}</div><div class="stat-s">${top ? `#${top.n} · ${pct(s.cost ? top.cost / s.cost * 100 : 0)} of the session` : ""}</div></div>
      <div><div class="stat-k">Messages</div><div class="stat-v">${int(s.message_count)}</div><div class="stat-s">${tokens(s.input_tokens + s.output_tokens + s.cache_read_tokens + s.cache_write_tokens)} tokens</div></div>
    </div>
    ${turns.length > 1 ? `<div class="panel">
      <div class="panel-head"><div class="panel-title">Cost per turn</div><div class="panel-aside">Click a bar to jump to its turn</div></div>
      <div class="panel-body">${chartSlot({
        items: turns, height: 150, keys: [["cost", "Cost", "--plan"]],
        labelOf: t => "#" + t.n, attrOf: t => `data-turn-jump="${t.n}"`,
        tipOf: t => tipRows("Turn #" + t.n, [["Cost", usd(t.cost)], ["Prompt", (t.prompt || "—").replace(/\s+/g, " ").slice(0, 60) + ((t.prompt || "").length > 60 ? "…" : "")]]),
      })}</div></div>` : ""}
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Turns</div>
        <div class="seg compact" role="group" aria-label="Order"><button data-turn-sort="order" aria-pressed="${state.turnSort === "order"}">In order</button><button data-turn-sort="cost" aria-pressed="${state.turnSort === "cost"}">Most expensive</button></div></div>
      <div class="turns">${carriedRow}${ordered.length ? ordered.map(t => turnHTML(t, max)).join("") : `<div class="empty-state">This session has no turns yet.</div>`}</div>
    </div>`;
};

function shareList(items, nameOf, metaOf, emptyText) {
  const total = items.reduce((a, m) => a + m.cost, 0);
  if (!items.length) return `<div class="panel"><div class="empty-state">${emptyText}</div></div>`;
  return `<div class="panel rows">${items.map(m => `
    <div class="list-row share-row" ${tipAttr(tipRows(nameOf(m).text, [["Cost", usd(m.cost)], ["Share", pct(m.cost / total * 100, 1)], ["Messages", int(m.message_count)], ["Sessions", int(m.sessions)]]))}>
      <div style="min-width:0"><div class="s-name" style="display:flex;align-items:center;gap:8px">${nameOf(m).html}</div><div class="share-meta">${metaOf(m)}</div></div>
      <div class="share-bar-cell"><div class="share-bar"><span data-w="${(m.cost / items[0].cost) * 100}%"></span></div></div>
      <div style="text-align:right"><div class="s-cost">${usd(m.cost)}</div><div class="s-when">${pct(m.cost / total * 100)} of total</div></div>
    </div>`).join("")}</div>`;
}

/* ===================== Settings ===================== */
function priceText(v) { return v == null ? "" : String(Number(Number(v).toFixed(4))); }
function moneyInput(value, attrs, { cls = "", placeholder = "", prefix = "$" } = {}) {
  return `<label class="money ${cls}">${prefix ? `<span aria-hidden="true">${prefix}</span>` : ""}<input type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="${esc(value)}" placeholder="${esc(placeholder)}" ${attrs}></label>`;
}

function pricesPanel() {
  const src = state.settingsSource, list = state.settings.prices;

  const isShown = m => m.message_count > 0 || m.edited || !m.listed;

  const hidden = list.models.length - list.models.filter(isShown).length;

    const changed = m.edited && Math.abs(m.price[key] - m.built_in[key]) > 1e-9;

      `data-price="${esc(m.model)}" data-field="${key}" data-focus-key="price:${esc(m.model)}:${key}" aria-label="${esc(m.model)} ${name} price" ${changed ? `title="Built-in: $${priceText(m.built_in[key])}"` : ""}`)}</td>`;
  };

      <td><div class="s-name">${esc(m.model)}${m.edited ? `<span class="tag">Edited</span>` : ""}</div>

      ${field(m, "input", "input")}${field(m, "output", "output")}${field(m, "cached_input", "cache read")}

    <div class="panel-head wrap"><div class="panel-title">${icon("cost")}API prices</div>

    <div class="panel-body" style="padding-bottom:6px"><p class="settings-note">Dollars per million tokens. Every cost in Token Meter uses these, and changing one reprices all your past usage. ${cacheNote} ${reference}</p></div>
    <div class="table-wrap"><table class="data prices">
      <thead><tr><th>Model</th><th class="r">Input</th><th class="r">Output</th><th class="r">Cache read</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5" class="muted">No ${label} models yet.</td></tr>`}</tbody>
    </table></div>
    ${hidden || state.showAllPrices ? `<div class="more-row"><button class="link-btn" data-toggle-prices>${state.showAllPrices ? "Show only models you use" : `Show all ${list.models.length} models in the price list`}</button></div>` : ""}
    <div class="add-price">
      <span class="lbl">Add a model</span>
      ${moneyInput("", `data-add="model" data-focus-key="add:model" aria-label="Model name"`, { cls: "name", prefix: "", placeholder: src === "claude" ? "Model name, e.g. claude-opus-6" : "Model name, e.g. gpt-6" })}
      ${moneyInput("", `data-add="input" data-focus-key="add:input" aria-label="Input price"`, { cls: "wide", placeholder: "Input" })}
      ${moneyInput("", `data-add="output" data-focus-key="add:output" aria-label="Output price"`, { cls: "wide", placeholder: "Output" })}
      ${moneyInput("", `data-add="cached_input" data-focus-key="add:cached_input" aria-label="Cache read price"`, { cls: "wide", placeholder: "Cache read" })}
      <button class="btn" data-add-price>Add</button>

    <div class="panel-foot">

        <span class="k">${name}</span>

function groupsPanel() {
  const g = state.settings.groups;
  const sourceOf = new Map(g.models.map(m => [m.model, m.source]));
  const rows = g.list.map(gr => {
    const members = new Set(gr.members.map(m => m.model));
    // Models you've used come first; long built-in groups fold the rest.

    const more = gr.members.length - visible.length;

    const options = g.models.filter(m => !members.has(m.model))

        <span class="note">${gr.rule ? `${esc(gr.rule)}, including new ones · ` : ""}${gr.members.length} ${gr.members.length === 1 ? "model" : "models"}</span>
        ${confirmButton("group:" + gr.id, "link-btn danger", "Delete", "Click again to delete", `data-group-delete="${esc(gr.id)}"`)}
      </div>
      <div class="chips">${chips || `<span class="note">No models yet.</span>`}${toggle}
        ${options ? `<select class="add-select" data-group-add="${esc(gr.id)}" aria-label="Add a model to ${esc(gr.name)}"><option value="">Add a model…</option>${options}</select>` : ""}
      </div>
    </div>`;
  }).join("");
  return `<div class="panel">
    <div class="panel-head"><div class="panel-title">${icon("chip")}Model groups</div></div>
    <div class="panel-body" style="padding-bottom:4px"><p class="settings-note">Groups add up cost on the Cost page. A model can be in as many groups as you like. The built-in groups pick up new models by name, and you can add or remove any model from any group.</p></div>
    <div class="rows">${rows || `<div class="empty-state">No groups. Create one below, or reset to the built-in groups.</div>`}</div>
    <div class="new-group">
      ${moneyInput("", `data-new-group data-focus-key="group:new" maxlength="40" aria-label="New group name"`, { cls: "name", prefix: "", placeholder: "New group, e.g. Daily drivers" })}
      <button class="btn" data-group-create>Create group</button>
    </div>
    <div class="panel-foot">
      <span class="note">${g.customized ? "Your own groups" : "Using the built-in groups"}</span>
      ${confirmButton("groups", "btn", "Reset to built-in groups", "Click again to reset", `data-reset-groups ${g.customized ? "" : "disabled"}`)}
    </div>
  </div>`;
}

/* Destructive buttons ask once more: the first click changes the label, the
   second within three seconds acts. Kept in state, not on the button, so a
   background re-render between the clicks doesn't forget the first. */
let confirming = null;
function confirmTwice(key) {
  if (confirming?.key === key && Date.now() < confirming.until) { confirming = null; return true; }
  confirming = { key, until: Date.now() + 3000 };
  render();
  setTimeout(() => { if (confirming?.key === key && Date.now() >= confirming.until) { confirming = null; render(); } }, 3050);
  return false;
}
function confirmButton(key, cls, label, confirmLabel, attrs = "") {
  const on = confirming?.key === key && Date.now() < confirming.until;
  return `<button class="${cls}${on ? " confirm" : ""}" ${attrs}>${on ? confirmLabel : label}</button>`;
}

function saveGroups(params, done) {
  saveSettings("/api/app/groups", params, done);
}

views.settings = () => {
  const sub = `<span class="save-state ${state.settingsError ? "err" : ""}">${esc(state.settingsError || state.saveState || "Stored on this Mac, kept across updates")}</span>`;
  if (!state.settings) {
    return viewHead("Settings", sub) + `<div class="panel"><div class="empty-state">${state.settingsError ? "" : `Loading<span class="loading-dots"></span>`}</div></div>`;
  }
  return viewHead("Settings", sub) + budgetsPanel() + pricesPanel() + groupsPanel();
};

// Bumped by every save: a response to a request sent before the latest save
// carries older settings and must not overwrite newer ones.
let settingsRev = 0;

async function loadSettings() {
  const rev = ++settingsRev;
  try {
    const settings = await api(`/api/app/settings?source=${state.settingsSource}`);
    if (rev === settingsRev) state.settings = settings;
    state.settingsError = null;
  } catch (e) {
    state.settingsError = String(e.message || e);
  }
  render();
}

function parseMoney(input) {
  const raw = input.value.replace(/[$,\s]/g, "");
  if (raw === "") return { empty: true };
  const value = Number(raw);
  const ok = Number.isFinite(value) && value >= 0;
  input.closest(".money")?.classList.toggle("invalid", !ok);
  return ok ? { value } : { invalid: true };
}

// Saves go out one at a time: the backend answers requests on several
// threads, so two sent together could reach the database in either order.
let saveQueue = Promise.resolve();
function saveSettings(path, params, done) {
  const rev = ++settingsRev;
  state.saveState = "Saving…";
  state.settingsError = null;
  render();
  saveQueue = saveQueue.then(() => sendSettings(path, params, done, rev));
  return saveQueue;
}

async function sendSettings(path, params, done, rev) {
  try {
    const query = new URLSearchParams({ ...params, view: state.settingsSource });
    const settings = await api(`${path}?${query}`, { method: "POST" });
    if (rev !== settingsRev) return;
    state.settings = settings;
    state.saveState = done;
    await refresh();
  } catch (e) {
    if (rev !== settingsRev) return;
    state.settingsError = String(e.message || e);
    state.saveState = "";
    render();
  }
}

function savePriceRow(model) {
  const params = { source: state.settingsSource, model };
  let empty = 0;
  for (const input of document.querySelectorAll(`[data-price="${CSS.escape(model)}"]`)) {
    const v = parseMoney(input);
    if (v.invalid) { state.settingsError = "Prices must be numbers of $0 or more."; render(); return; }
    if (v.empty) { empty++; continue; }
    params[input.dataset.field] = v.value;
  }
  if (empty === 3) params.reset = "1";
  saveSettings("/api/app/prices", params, `Saved ${model} · all usage repriced`);
}

function saveBudgets(src) {
  const params = { source: src };
  for (const input of document.querySelectorAll(`[data-budget="${src}"]`)) {
    const v = parseMoney(input);
    if (v.invalid || v.value === 0) { input.closest(".money")?.classList.add("invalid"); state.settingsError = "A budget must be more than $0, or empty for none."; render(); return; }
    if (!v.empty) params[input.dataset.budgetPeriod] = v.value;
  }
  saveSettings("/api/app/budgets", params, `Saved ${SOURCE_LABEL[src]} budgets`);
}

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.price) savePriceRow(t.dataset.price);
  else if (t.dataset.budget) saveBudgets(t.dataset.budget);
  else if (t.dataset.groupRename) {
    const name = t.value.trim();
    if (!name) { state.settingsError = "A group needs a name."; render(); return; }
    saveGroups({ action: "rename", id: t.dataset.groupRename, name }, `Renamed to ${name}`);
  } else if (t.dataset.groupAdd && t.value) {
    saveGroups({ action: "add", id: t.dataset.groupAdd, model: t.value }, `Added ${t.value}`);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.closest?.("[data-add]")) $("[data-add-price]")?.click();
  if (e.key === "Enter" && e.target.matches?.("[data-new-group]")) $("[data-group-create]")?.click();
  if (e.key === "Enter" && e.target.matches?.("[data-group-rename]")) e.target.blur();
});

/* ===================== Shell ===================== */
function renderSidebar() {
  document.querySelectorAll("#source-seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.source === state.source));
  document.querySelectorAll(".nav a").forEach(a => {
    if (a.dataset.view === (state.view === "transcript" ? "sessions" : state.view)) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  if (!state.data) { $("#sync").innerHTML = ""; return; }
  $("#nav-session-count").textContent = state.data.session_total ? int(state.data.session_total) : "";
  const levels = sourcesShown().map(s => state.data.limits[s]).filter(s => s.status === "ok").flatMap(s => {
    const out = [s.five_hour?.pct, s.weekly?.pct].filter(v => v != null).map(level);
    if (s.forecast?.exhaustion_at && s.weekly && s.forecast.exhaustion_at < s.weekly.end) out.push("crit");
    return out;
  }).concat(sourcesShown().flatMap(s => state.data.limits[s].budgets.map(b => level(b.pct))));
  const alert = $("#nav-limit-alert");
  alert.hidden = !levels.some(l => l !== "ok");
  alert.className = "nav-alert" + (levels.includes("crit") ? "" : " warn");
  alert.title = levels.includes("crit") ? "A limit is about to run out" : "A limit is above 75%";
  const lines = ["claude", "codex"].map(s => {
    const src = state.data.limits[s];
    const text = src.status === "ok" ? `${SOURCE_LABEL[s]} · synced ${ago(src.synced_at)}`
      : src.status === "missing" ? `${SOURCE_LABEL[s]} · not installed`
      : src.status === "error" ? `${SOURCE_LABEL[s]} · sync failed` : `${SOURCE_LABEL[s]} · not synced yet`;
    return `<div class="sync-line" ${src.status === "error" ? `title="${esc(src.error || "")}"` : ""}><span class="dot ${src.status === "ok" ? "" : src.status === "error" ? "err" : "off"}"></span>${esc(text)}</div>`;
  }).join("");
  $("#sync").innerHTML = lines + `<button class="sync-btn" id="sync-btn">${icon("sync")}Sync now</button>`;
}

function render() {
  tips.clear();
  charts.length = 0;
  // A background refresh re-renders the page; keep whatever is being typed.
  const active = document.activeElement?.dataset?.focusKey ? document.activeElement : null;
  const typing = active && { key: active.dataset.focusKey, value: active.value, start: active.selectionStart, end: active.selectionEnd };
  renderSidebar();
  document.querySelectorAll(".view").forEach(v => { v.hidden = v.dataset.view !== state.view; });
  const el = $("#view-" + state.view);
  if (state.view === "settings") {
    el.innerHTML = views.settings();
    if (typing) {
      const input = el.querySelector(`[data-focus-key="${CSS.escape(typing.key)}"]`);
      if (input) { input.value = typing.value; input.focus(); input.setSelectionRange(typing.start, typing.end); }
    }
    return;
  }
  if (!state.data) {
    el.innerHTML = viewHead({ overview: "Overview", limits: "Limits", cost: "Cost", sessions: "Sessions", projects: "Projects", models: "Models" }[state.view], "") + (state.error
      ? `<div class="panel"><div class="empty-state"><h3>Couldn't load your usage</h3>${esc(state.error)}<p style="margin:10px 0 0"><button class="sync-btn" data-retry>Try again</button></p></div></div>`
      : `<div class="panel"><div class="empty-state"><h3>Reading your logs<span class="loading-dots"></span></h3>The first launch indexes every Claude Code and Codex session on this Mac, which can take a minute. Nothing leaves your computer.</div></div>`);
    return;
  }
  el.innerHTML = (state.error ? `<div class="forecast crit" style="margin-bottom:16px">${icon("alert")}<div>Couldn't refresh: ${esc(state.error)}</div></div>` : "") + views[state.view]();
  if (state.view === "overview") fillOverview();
  // On narrow screens the year heatmap scrolls; open it on the latest weeks.
  el.querySelectorAll(".heat-scroll").forEach(h => { h.scrollLeft = h.scrollWidth; });
  drawCharts();
  settle(el);
}

function openTranscript(id) {
  const hash = "#session/" + encodeURIComponent(id);
  if (location.hash !== hash) history.replaceState(null, "", hash);
  if (state.transcriptId !== id) {
    state.transcriptId = id;
    state.turnSort = "order";
    state.expanded = new Set();
    state.showCarried = false;
    loadTranscript(id);
  }
  state.view = "transcript";
  render();
  window.scrollTo(0, 0);
}

function go(view) {
  if (view.startsWith("session/")) { openTranscript(decodeURIComponent(view.slice(8))); return; }
  if (!views[view] || view === "transcript") view = "overview";
  if (location.hash !== "#" + view) history.replaceState(null, "", "#" + view);
  state.view = view;
  if (view === "sessions" && !state.sessions && state.data) refresh();
  if (view === "settings") { state.saveState = ""; loadSettings(); }
  render();
  $("#main").scrollTop = 0;
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const t = e.target;
  const navLink = t.closest(".nav a");
  if (navLink) { e.preventDefault(); go(navLink.dataset.view); return; }
  const goBtn = t.closest("[data-go]");
  if (goBtn) { go(goBtn.dataset.go); return; }
  const periodBtn = t.closest("[data-period]");
  if (periodBtn) {
    if (periodBtn.dataset.period === state.period) return;
    state.period = periodBtn.dataset.period; save("usage-period", state.period);
    document.querySelectorAll("[data-period]").forEach(b => b.setAttribute("aria-pressed", b.dataset.period === state.period));
    refresh(); return;
  }
  const srcBtn = t.closest("[data-source]");
  if (srcBtn) {
    if (srcBtn.dataset.source === state.source) return;
    state.source = srcBtn.dataset.source; save("usage-source", state.source);
    state.sessions = state.view === "sessions" ? state.sessions : null;
    document.querySelectorAll("#source-seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.source === state.source));
    refresh(); return;
  }
  if (t.closest("[data-retry]")) { state.error = null; render(); refresh(); return; }
  const settingsSrc = t.closest("[data-settings-source]");
  if (settingsSrc) {
    if (settingsSrc.dataset.settingsSource === state.settingsSource) return;
    state.settingsSource = settingsSrc.dataset.settingsSource;
    state.showAllPrices = false; state.saveState = ""; state.settingsError = null;
    loadSettings(); return;
  }
  if (t.closest("[data-toggle-prices]")) { state.showAllPrices = !state.showAllPrices; render(); return; }
  const priceReset = t.closest("[data-price-reset]");
  if (priceReset) {
    const model = priceReset.dataset.priceReset;
    saveSettings("/api/app/prices", { source: state.settingsSource, model, reset: "1" }, `Reset ${model} to the built-in price`);
    return;
  }
  if (t.closest("[data-add-price]")) {
    const params = { source: state.settingsSource };
    const name = $("[data-add=model]").value.trim();
    if (!name) { state.settingsError = "Enter a model name, as it appears in your logs."; render(); return; }
    params.model = name;
    for (const key of ["input", "output", "cached_input"]) {
      const v = parseMoney($(`[data-add="${key}"]`));
      if (v.invalid) { state.settingsError = "Prices must be numbers of $0 or more."; render(); return; }
      if (!v.empty) params[key] = v.value;
    }
    if (params.input == null || params.output == null) { state.settingsError = "Enter at least the input and output prices."; render(); return; }
    saveSettings("/api/app/prices", params, `Added ${name}`);
    return;
  }
  const resetAll = t.closest("[data-reset-prices]");
  if (resetAll) {
    if (!confirmTwice("prices:" + state.settingsSource)) return;
    saveSettings("/api/app/prices/reset", { source: state.settingsSource }, `${SOURCE_LABEL[state.settingsSource]} prices reset to built-in`);
    return;
  }
  const groupMore = t.closest("[data-group-more]");
  if (groupMore) {
    const id = groupMore.dataset.groupMore;
    if (state.openGroups.has(id)) state.openGroups.delete(id); else state.openGroups.add(id);
    render(); return;
  }
  const groupRemove = t.closest("[data-group-remove]");
  if (groupRemove) {
    saveGroups({ action: "remove", id: groupRemove.dataset.groupRemove, model: groupRemove.dataset.model }, `Removed ${groupRemove.dataset.model}`);
    return;
  }
  const groupDelete = t.closest("[data-group-delete]");
  if (groupDelete) {
    if (!confirmTwice("group:" + groupDelete.dataset.groupDelete)) return;
    saveGroups({ action: "delete", id: groupDelete.dataset.groupDelete }, "Group deleted");
    return;
  }
  if (t.closest("[data-group-create]")) {
    const name = $("[data-new-group]").value.trim();
    if (!name) { state.settingsError = "Give the new group a name."; render(); return; }
    saveGroups({ action: "create", name }, `Created ${name}`);
    return;
  }
  const resetGroups = t.closest("[data-reset-groups]");
  if (resetGroups) {
    if (!confirmTwice("groups")) return;
    saveGroups({ action: "reset" }, "Back to the built-in groups");
    return;
  }
  const clearBudgets = t.closest("[data-clear-budgets]");
  if (clearBudgets) {
    const src = clearBudgets.dataset.clearBudgets;
    saveSettings("/api/app/budgets", { source: src }, `Cleared ${SOURCE_LABEL[src]} budgets`);
    return;
  }
  if (t.closest("#sync-btn")) {
    const btn = t.closest("#sync-btn");
    btn.classList.add("spinning"); btn.disabled = true;
    (async () => {
      for (const s of ["claude", "codex"]) {
        try { await fetch(`/api/remote-usage/poll?source=${s}`, { method: "POST" }); } catch (err) {}
      }
      await refresh();
    })();
    return;
  }
  const sort = t.closest("th[data-sort]");
  if (sort) {
    const k = sort.dataset.sort;
    state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: k === "name" ? 1 : -1 };
    render(); return;
  }
  if (t.closest("[data-more]")) { state.limit += 40; render(); return; }
  const sortTurns = t.closest("[data-turn-sort]");
  if (sortTurns) { state.turnSort = sortTurns.dataset.turnSort; render(); return; }
  const expand = t.closest("[data-expand]");
  if (expand) { state.expanded.add(expand.dataset.expand); render(); return; }
  if (t.closest("[data-carried]")) { state.showCarried = !state.showCarried; render(); return; }
  const jump = t.closest("[data-turn-jump]");
  if (jump) {
    if (state.turnSort !== "order") { state.turnSort = "order"; render(); }
    const target = document.getElementById("turn-" + jump.dataset.turnJump);
    if (target) {
      target.scrollIntoView({ behavior: reducedMotion ? "auto" : "smooth", block: "center" });
      target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash");
    }
    return;
  }
  const copy = t.closest("[data-copy]");
  if (copy) {
    const label = copy.textContent;
    navigator.clipboard?.writeText(copy.dataset.copy).then(() => { copy.textContent = "Copied"; setTimeout(() => { copy.textContent = label; }, 1400); }, () => {});
    return;
  }
  const row = t.closest("[data-session]");
  if (row) openTranscript(row.dataset.session);
});

document.addEventListener("input", e => {
  if (e.target.id === "session-q") {
    state.query = e.target.value;
    state.limit = 40;
    const pos = e.target.selectionStart;
    render();
    const input = $("#session-q");
    input.focus();
    input.setSelectionRange(pos, pos);
  }
});

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());
addEventListener("hashchange", () => go(location.hash.slice(1)));

go(location.hash.slice(1) || "overview");
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
