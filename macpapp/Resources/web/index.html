<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Meter</title>
<style>
  :root {
    color-scheme: light;
    --ground: #f0f0f2;
    --sidebar: #e7e7ea;
    --panel: #ffffff;
    --panel-2: #f6f6f8;
    --hair: rgba(0, 0, 0, 0.085);
    --hair-strong: rgba(0, 0, 0, 0.14);
    --ink: #1d1d1f;
    --ink-2: #4f4f55;
    --ink-3: #6b6b71;
    --track: #e5e5ea;
    --plan: #2a78d6;
    --plan-soft: #b7d3f6;
    --plan-ink: #1c5cab;
    --plan-wash: rgba(42, 120, 214, 0.10);
    --warn: #fab219;
    --warn-ink: #8a5a00;
    --warn-wash: rgba(250, 178, 25, 0.16);
    --crit: #d03b3b;
    --crit-ink: #b42a2a;
    --crit-wash: rgba(208, 59, 59, 0.10);
    --good-ink: #006300;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
    --heat-0: #ececf0; --heat-1: #cde2fb; --heat-2: #86b6ef; --heat-3: #3987e5; --heat-4: #1c5cab;
    --grid: #e6e6ea;
    --axis: #c4c4ca;
    --tip: #ffffff;
    --tip-shadow: 0 8px 28px rgba(20, 20, 30, 0.16), 0 1px 3px rgba(20, 20, 30, 0.08);
    --radius: 12px;
    --side-w: 236px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --ground: #1b1b1d; --sidebar: #222225; --panel: #262628; --panel-2: #2d2d30;
      --hair: rgba(255, 255, 255, 0.085); --hair-strong: rgba(255, 255, 255, 0.15);
      --ink: #f2f2f4; --ink-2: #c2c2c8; --ink-3: #a0a0a8;
      --track: #3a3a3f; --plan: #3987e5; --plan-soft: #1c5cab; --plan-ink: #86b6ef; --plan-wash: rgba(57, 135, 229, 0.16);
      --warn: #fab219; --warn-ink: #f5c04a; --warn-wash: rgba(250, 178, 25, 0.14);
      --crit: #d03b3b; --crit-ink: #ff8a80; --crit-wash: rgba(208, 59, 59, 0.18);
      --good-ink: #3ccf3c;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
      --heat-0: #303034; --heat-1: #184f95; --heat-2: #256abf; --heat-3: #3987e5; --heat-4: #86b6ef;
      --grid: #343438; --axis: #48484d; --tip: #303033;
      --tip-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #1b1b1d; --sidebar: #222225; --panel: #262628; --panel-2: #2d2d30;
    --hair: rgba(255, 255, 255, 0.085); --hair-strong: rgba(255, 255, 255, 0.15);
    --ink: #f2f2f4; --ink-2: #c2c2c8; --ink-3: #a0a0a8;
    --track: #3a3a3f; --plan: #3987e5; --plan-soft: #1c5cab; --plan-ink: #86b6ef; --plan-wash: rgba(57, 135, 229, 0.16);
    --warn: #fab219; --warn-ink: #f5c04a; --warn-wash: rgba(250, 178, 25, 0.14);
    --crit: #d03b3b; --crit-ink: #ff8a80; --crit-wash: rgba(208, 59, 59, 0.18);
    --good-ink: #3ccf3c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --heat-0: #303034; --heat-1: #184f95; --heat-2: #256abf; --heat-3: #3987e5; --heat-4: #86b6ef;
    --grid: #343438; --axis: #48484d; --tip: #303033;
    --tip-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  ::selection { background: var(--plan-wash); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--plan); outline-offset: 2px; border-radius: 6px; }
  button { font: inherit; color: inherit; }
  a { color: var(--plan-ink); text-underline-offset: 3px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-3); }
  .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Shell ---------- */
  .app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
  .sidebar {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: var(--sidebar); border-right: 1px solid var(--hair);
    padding: 18px 12px 14px; display: flex; flex-direction: column; gap: 18px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 0; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--panel); display: grid; place-items: center; }
  .brand-mark .icon { width: 18px; height: 18px; stroke-width: 1.8; }
  .brand-name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11.5px; color: var(--ink-3); }

  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px;
    color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 13px;
  }
  .nav a:hover { background: var(--hair); color: var(--ink); }
  .nav a[aria-current="page"] { background: var(--plan-wash); color: var(--ink); font-weight: 600; }
  .nav-group { font-size: 11.5px; font-weight: 600; color: var(--ink-3); padding: 12px 10px 4px; }
  .nav-group:first-child { padding-top: 0; }
  .nav a[aria-current="page"] .icon { color: var(--plan); }
  .nav .count { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .nav-alert { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--crit); }
  .nav-alert.warn { background: var(--warn); }

  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 14px; padding: 0 4px; }
  .side-label { font-size: 11.5px; color: var(--ink-3); margin: 0 4px 6px; }
  .seg { display: flex; background: var(--hair); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button {
    flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 5px 8px; cursor: pointer;
    font-size: 12px; font-weight: 550; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 0 0 0.5px var(--hair); }
  .seg.compact button { padding: 4px 7px; }
  .seg button { white-space: nowrap; }

  .sync { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 10px; background: var(--hair); }
  .sync-line { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); }
  .sync-line .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good-ink); flex: none; }
  .sync-line .dot.off { background: var(--ink-3); }
  .sync-line .dot.err { background: var(--crit); }
  .sync-btn {
    margin-top: 2px; border: 0; border-radius: 7px; padding: 6px 8px; cursor: pointer; background: var(--panel);
    font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 0 0 1px var(--hair);
  }
  .sync-btn:hover { box-shadow: 0 0 0 1px var(--hair-strong); }
  .sync-btn.spinning .icon { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .side-select {
    width: 100%; font: inherit; font-size: 12px; color: var(--ink-2); background: transparent;
    border: 1px solid var(--hair-strong); border-radius: 7px; padding: 5px 8px;
  }

  /* ---------- Main ---------- */
  .main { min-width: 0; padding: 24px 32px 56px; }
  .view { max-width: 1880px; margin: 0 auto; }
  .view[hidden] { display: none; }
  .view-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .view-head h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.015em; margin: 0; }
  .view-head .sub { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
  .period button { min-width: 34px; }

  .grid { display: grid; gap: 16px; }
  .grid + .grid, .grid + .panel, .panel + .grid, .panel + .panel { margin-top: 16px; }
  .g-overview { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
  .g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-3-2 { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .panel { background: var(--panel); border-radius: var(--radius); box-shadow: 0 0 0 1px var(--hair); min-width: 0; }
  /* Grid and stack gaps already space these; the sibling margin is for plain view flow. */
  .grid > .panel, .stack > .panel, .grid > .stack { margin-top: 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px 0; }
  .panel-head.wrap { flex-wrap: wrap; gap: 10px 12px; }
  .panel-title { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 650; }
  .panel-title .icon { color: var(--ink-3); }
  .panel-aside { font-size: 12px; color: var(--ink-3); }
  .panel-body { padding: 14px 18px 18px; }
  .rows > * + * { border-top: 1px solid var(--hair); }
  .link-btn { border: 0; background: none; padding: 0; cursor: pointer; color: var(--plan-ink); font-size: 12px; font-weight: 550; }
  .link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- Allowance meters ---------- */
  .meter { padding: 14px 18px; }
  .meter-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
  .meter-name { font-size: 13px; font-weight: 600; }
  .meter-value { font-size: 13px; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: baseline; gap: 4px; }
  .meter-value b { font-size: 20px; font-weight: 650; color: var(--ink); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .meter-bar { position: relative; height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
  .meter-fill, .meter-proj {
    position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; width: 0;
    transition: width 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .meter-fill { background: var(--plan); z-index: 2; }
  .meter-proj { background: var(--plan-soft); z-index: 1; }
  .meter[data-level="warn"] .meter-fill { background: var(--warn); }
  .meter[data-level="crit"] .meter-fill { background: var(--crit); }
  .meter[data-proj="over"] .meter-proj { background: var(--crit-wash); box-shadow: inset 0 0 0 1px var(--crit-wash); }
  .meter-ticks { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .meter-ticks i { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--panel); }
  .meter-wrap { position: relative; padding: 3px 0; }
  .meter-now { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink); opacity: 0.55; z-index: 4; }
  .lvl { display: inline-flex; align-items: baseline; gap: 4px; margin-right: 6px; font-size: 12px; font-weight: 650; }
  .lvl .icon { align-self: center; }
  .lvl .icon { width: 14px; height: 14px; }
  .lvl.warn { color: var(--warn-ink); }
  .lvl.crit { color: var(--crit-ink); }
  .meter-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
  .meter-foot b { color: var(--ink-2); font-weight: 600; }
  .forecast { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; color: var(--ink-2); background: var(--panel-2); }
  .forecast .icon { margin-top: 1px; color: var(--ink-3); }
  .forecast.crit { background: var(--crit-wash); color: var(--ink); }
  .forecast.crit .icon { color: var(--crit-ink); }
  .forecast.warn { background: var(--warn-wash); color: var(--ink); }
  .forecast.warn .icon { color: var(--warn-ink); }
  .forecast b { font-weight: 650; }
  .source-head { display: flex; align-items: center; gap: 8px; padding: 14px 18px 4px; }
  .source-head .name { font-size: 13.5px; font-weight: 650; }
  .source-head .plan { font-size: 12px; color: var(--ink-3); }
  .source-head .aside { margin-left: auto; font-size: 12px; color: var(--ink-3); }
  .glyph { width: 18px; height: 18px; color: var(--ink-2); flex: none; }

  .empty-state { padding: 22px 18px; color: var(--ink-2); font-size: 12.5px; }
  .empty-state h3 { margin: 0 0 4px; font-size: 13.5px; color: var(--ink); }
  .empty-state ol { margin: 8px 0 0; padding-left: 18px; }
  .empty-state li { margin: 3px 0; }
  .empty-state code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; background: var(--panel-2); border-radius: 4px; padding: 1px 5px; box-shadow: 0 0 0 1px var(--hair); }

  /* ---------- Cost ---------- */
  .cost-figure { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .cost-figure .big { font-size: 34px; font-weight: 650; letter-spacing: -0.025em; line-height: 1.05; }
  .delta { font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
  .delta.up, .delta.down { color: var(--ink-2); }
  .delta .vs { font-weight: 400; color: var(--ink-3); }
  .cost-note { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .cost-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 14px; border-top: 1px solid var(--hair); }
  .cost-stats > div { padding: 10px 0 0; }
  .cost-stats > div + div { padding-left: 12px; border-left: 1px solid var(--hair); }
  .stat-k { font-size: 11.5px; color: var(--ink-3); }
  .stat-v { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 1px; }

  .src-split { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; padding: 12px 0 2px; border-top: 1px solid var(--hair); }
  .src-row { display: grid; grid-template-columns: 18px 64px minmax(0, 1fr) auto 40px; align-items: center; gap: 10px; font-size: 12.5px; }
  .src-name { font-weight: 600; }
  .src-val { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .src-share { color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
  .capacity { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 16px; background: var(--track); }
  .capacity span { height: 100%; flex: 0 1 0; transition: flex-grow 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease; min-width: 0; }
  .capacity:hover span, .capacity.focus span { opacity: 0.3; }
  .capacity span:hover, .capacity span.lit { opacity: 1 !important; }
  .legend { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 44px; align-items: center; gap: 10px; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; font-size: 12.5px; transition: background 0.15s ease; }
  .legend li.lit { background: var(--panel-2); }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; }
  .legend .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .legend .vl { font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend .sh { color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- Charts ---------- */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .chart .baseline { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
  .chart .tick { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .bar { transition: opacity 0.15s ease; }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .col:hover .bar { opacity: 0.8; }
  .chart .col:hover .hit { fill: var(--plan-wash); }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .tip {
    position: fixed; z-index: 50; pointer-events: none; min-width: 150px; max-width: 280px;
    background: var(--tip); color: var(--ink); border-radius: 10px; padding: 9px 11px; font-size: 12px;
    box-shadow: var(--tip-shadow), 0 0 0 1px var(--hair); opacity: 0; transform: translateY(4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .tip.on { opacity: 1; transform: none; }
  .tip .t { font-weight: 650; margin-bottom: 4px; }
  .tip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--ink-2); }
  .tip .r b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tip .r i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }

  /* ---------- Lists & tables ---------- */
  .list-row { display: grid; align-items: center; gap: 12px; padding: 10px 18px; min-width: 0; }
  .session-row { grid-template-columns: 18px minmax(0, 1fr) auto; cursor: pointer; }
  .session-row:hover { background: var(--panel-2); }
  .s-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .s-name.untitled { font-weight: 500; color: var(--ink-2); }
  .s-name .q { color: var(--ink-3); font-weight: 400; }
  .s-meta { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .s-cost { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .s-when { font-size: 11.5px; color: var(--ink-3); text-align: right; }

  .eff { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .eff.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .activity .eff { border-top: 1px solid var(--hair); }
  .activity-grid { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 28px; align-items: end; }
  .activity-foot { padding: 0 18px 12px; }
  .activity-foot .scale { margin-top: 0; }
  .stack.fill > :last-child { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .stack.fill > :last-child > .panel-body, .stack.fill > :last-child > .rows { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .chart.fill { flex: 1 1 auto; min-height: 170px; }
  .chart.fill svg { position: absolute; inset: 0; }
  .weeks-panel { display: flex; flex-direction: column; }
  .weeks-panel .panel-body { flex: 1; display: flex; flex-direction: column; }
  .weeks-panel .weeks { flex: 1; height: auto; min-height: 92px; }
  .weeks-panel .wk-bar { flex: 1; height: auto; min-height: 50px; }
  .eff > div { padding: 14px 18px; min-width: 0; }
  .eff > div + div { border-left: 1px solid var(--hair); }
  .eff .stat-v { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .eff .stat-s { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .search {
    flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 34px;
    background: var(--panel); border-radius: 9px; box-shadow: 0 0 0 1px var(--hair-strong); color: var(--ink-3);
  }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); height: 100%; }
  .search input::placeholder { color: var(--ink-3); }
  .search:focus-within { box-shadow: 0 0 0 2px var(--plan); }
  .result-count { font-size: 12px; color: var(--ink-3); white-space: nowrap; }

  table.data { width: 100%; border-collapse: collapse; }
  table.data th {
    text-align: left; font-weight: 600; font-size: 11.5px; color: var(--ink-3); padding: 11px 12px; border-bottom: 1px solid var(--hair);
    white-space: nowrap; user-select: none;
  }
  table.data th.sortable { cursor: pointer; }
  table.data th.sortable:hover { color: var(--ink); }
  table.data th[aria-sort] { color: var(--ink); }
  table.data th .arrow { display: inline-block; width: 10px; margin-left: 3px; color: var(--plan); }
  table.data td { padding: 10px 12px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
  table.data tr:last-child td { border-bottom: 0; }
  table.data td.r, table.data th.r { text-align: right; }
  table.data td.r { font-variant-numeric: tabular-nums; }
  table.data tbody tr { cursor: pointer; }
  table.data tbody tr:hover td { background: var(--panel-2); }
  table.data tbody tr[aria-selected="true"] td { background: var(--plan-wash); }
  table.data th:first-child, table.data td:first-child { padding-left: 18px; }
  table.data th:last-child, table.data td:last-child { padding-right: 18px; }
  .name-cell { max-width: 460px; min-width: 220px; }
  .src { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
  .src .glyph { width: 15px; height: 15px; }
  .table-wrap { overflow-x: auto; }
  .more-row { display: flex; justify-content: center; padding: 12px; border-top: 1px solid var(--hair); }

  /* ---------- Settings ---------- */
  .settings-note { margin: 0; font-size: 12.5px; color: var(--ink-2); max-width: 70ch; }
  table.data.prices tbody tr { cursor: default; }
  table.data.prices tbody tr:hover td { background: none; }
  table.data.prices td { padding-top: 8px; padding-bottom: 8px; }
  table.data.prices .s-name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .tag { font-size: 11px; font-weight: 600; color: var(--plan-ink); background: var(--plan-wash); border-radius: 5px; padding: 1px 6px; }
  .money {
    display: inline-flex; align-items: center; gap: 2px; height: 28px; padding: 0 8px; border-radius: 7px;
    background: var(--panel); box-shadow: 0 0 0 1px var(--hair-strong); color: var(--ink-3); font-size: 12.5px;
  }
  .money:focus-within { box-shadow: 0 0 0 2px var(--plan); }
  .money input {
    width: 64px; border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink);
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .money input::placeholder { color: var(--ink-3); }
  .money.wide input { width: 84px; }
  .money.name input { width: 220px; text-align: left; }
  .money.invalid { box-shadow: 0 0 0 2px var(--crit); }
  .add-price { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 18px; border-top: 1px solid var(--hair); }
  .add-price .lbl { font-size: 12px; color: var(--ink-3); }
  .panel-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 18px; border-top: 1px solid var(--hair); }
  .btn {
    border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer; background: var(--panel);
    font-size: 12px; font-weight: 600; color: var(--ink); box-shadow: 0 0 0 1px var(--hair-strong);
  }
  .btn:hover { box-shadow: 0 0 0 1px var(--ink-3); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.confirm { color: var(--crit-ink); box-shadow: 0 0 0 1px var(--crit); }
  .budget-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .budget-src { padding: 14px 18px; }
  .budget-src + .budget-src { border-top: 1px solid var(--hair); }
  .budget-src .source-head { padding: 0 0 10px; }
  .budget-field { display: flex; flex-direction: column; gap: 5px; }
  .budget-field .k { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .budget-field .money { align-self: flex-start; }
  .budget-field .spent { font-size: 11.5px; color: var(--ink-3); }
  .save-state { font-size: 12px; color: var(--ink-3); }
  .save-state.err { color: var(--crit-ink); }
  .nav-sep { height: 1px; background: var(--hair); margin: 10px 10px 6px; }
  .group-row { padding: 12px 18px 14px; }
  .group-row + .group-row { border-top: 1px solid var(--hair); }
  .group-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-bottom: 8px; }
  .group-name {
    font: inherit; font-size: 13.5px; font-weight: 650; color: var(--ink); background: transparent;
    border: 0; border-radius: 6px; padding: 3px 6px; margin-left: -6px; width: 14em; max-width: 100%;
  }
  .group-name:hover { box-shadow: 0 0 0 1px var(--hair-strong); }
  .group-name:focus { outline: 0; box-shadow: 0 0 0 2px var(--plan); background: var(--panel); }
  .group-head .note { flex: 1; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 3px 3px 8px; border-radius: 6px;
    background: var(--panel-2); box-shadow: 0 0 0 1px var(--hair); font-size: 12px; color: var(--ink);
  }
  .chip .glyph { width: 13px; height: 13px; color: var(--ink-3); }
  .chip-x { display: grid; place-items: center; width: 18px; height: 18px; border: 0; border-radius: 4px; padding: 0; background: none; color: var(--ink-3); cursor: pointer; }
  .chip-x:hover { background: var(--hair); color: var(--ink); }
  .chip-x .icon { width: 12px; height: 12px; }
  .add-select {
    font: inherit; font-size: 12px; color: var(--ink-2); background: var(--panel); cursor: pointer;
    border: 0; box-shadow: 0 0 0 1px var(--hair-strong); border-radius: 6px; padding: 4px 6px; max-width: 220px;
  }
  .link-btn.danger { color: var(--crit-ink); }
  .link-btn.confirm { color: var(--crit-ink); font-weight: 650; }
  .new-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 18px; border-top: 1px solid var(--hair); }

  .sessions-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  .back-link { border: 0; background: none; padding: 0; margin: 0 0 8px; cursor: pointer; color: var(--plan-ink); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
  .back-link .icon { width: 14px; height: 14px; }
  .transcript-title { overflow-wrap: anywhere; }
  .transcript-sub { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .transcript-sub .glyph { width: 14px; height: 14px; }
  .transcript-total { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .transcript-total .big { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
  .turns > * + * { border-top: 1px solid var(--hair); }
  .turns { margin-top: 10px; }
  .turn { padding: 14px 18px 16px; scroll-margin-top: 80px; }
  .turn.flash { animation: turn-flash 1.4s ease-out; }
  @keyframes turn-flash { from { background: var(--plan-wash); } to { background: transparent; } }
  .turn-head { display: flex; align-items: baseline; gap: 10px; }
  .turn-n { font-weight: 650; color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 30px; }
  .turn-when { color: var(--ink-3); font-size: 12px; }
  .turn-cost { margin-left: auto; font-weight: 650; font-size: 15px; font-variant-numeric: tabular-nums; }
  .turn-bar { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin: 8px 0 10px; }
  .turn-bar span { display: block; height: 100%; width: 0; background: var(--plan); border-radius: 2px; }
  .turn-prompt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.5; max-width: 900px; }
  .turn-prompt.command { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  .turn-prompt.none { color: var(--ink-3); }
  .turn-meta { margin-top: 8px; font-size: 12px; color: var(--ink-3); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--panel-2); box-shadow: 0 0 0 1px var(--hair); color: var(--ink-2); }
  .turn-response summary { cursor: pointer; margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--plan-ink); width: fit-content; }
  .turn-response-body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: var(--panel-2); font-size: 12.5px; line-height: 1.5; color: var(--ink-2); max-height: 340px; overflow: auto; max-width: 900px; }
  .carried { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; font-size: 12.5px; color: var(--ink-3); background: var(--panel-2); }
  .kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 7px 12px; font-size: 12.5px; }
  .kv dt { color: var(--ink-3); }
  .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .copy { border: 0; background: none; color: var(--plan-ink); cursor: pointer; padding: 0 0 0 6px; font-size: 12px; }

  .share-row { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 90px; }
  .share-bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .share-bar span { display: block; height: 100%; border-radius: 4px; background: var(--plan); width: 0; transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
  .share-meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Heat grids ---------- */
  .heat { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); grid-template-rows: repeat(7, 1fr); gap: 2px; }
  .heat-scroll { overflow-x: auto; scrollbar-width: thin; }
  .heat i, .hw i { display: block; aspect-ratio: 1; border-radius: 3px; background: var(--heat-0); }
  .heat i.out { visibility: hidden; }
  .heat-wrap { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 6px; }
  .heat-days { display: grid; grid-template-rows: repeat(7, 1fr); gap: 2px; font-size: 10.5px; color: var(--ink-3); }
  .heat-days span { display: flex; align-items: center; }
  .heat-months { position: relative; height: 16px; font-size: 10.5px; color: var(--ink-3); margin-left: 34px; }
  .heat-months span { position: absolute; top: 0; }
  .scale { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-3); justify-content: flex-end; margin-top: 12px; }
  .scale i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .hw { display: grid; grid-template-columns: 34px repeat(24, minmax(0, 1fr)); gap: 3px; align-items: center; font-size: 10.5px; color: var(--ink-3); }
  .hw .hl { text-align: center; }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts > div { padding: 14px 18px; }
  .facts > div:nth-child(even) { border-left: 1px solid var(--hair); }
  .facts > div:nth-child(n+3) { border-top: 1px solid var(--hair); }
  .facts .stat-v { font-size: 17px; font-weight: 650; }

  /* ---------- Limits view ---------- */
  .window-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .window-grid > .window + .window { border-left: 1px solid var(--hair); }
  .window-grid.single { grid-template-columns: minmax(0, 1fr); }
  .window { min-width: 0; padding-bottom: 6px; }
  .mini { display: flex; align-items: flex-end; gap: 4px; height: 64px; margin: 4px 18px 0; }
  .mini .mcol { flex: 1; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; height: 100%; min-width: 0; }
  .mini .mbar { background: var(--plan); border-radius: 4px 4px 0 0; min-height: 2px; }
  .mini .mbar.future { background: var(--track); min-height: 2px; }
  .mini-x { display: flex; gap: 4px; margin: 4px 18px 0; font-size: 10.5px; color: var(--ink-3); }
  .mini-x span { flex: 1; text-align: center; min-width: 0; overflow: hidden; white-space: nowrap; }
  .window-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; padding: 12px 18px 12px; font-size: 12px; }
  .window-facts .stat-v { font-size: 13.5px; }
  .weeks { display: flex; align-items: flex-end; gap: 8px; height: 92px; padding: 0 18px; }
  .weeks .wk { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; min-width: 0; }
  .weeks .wk-bar { width: 100%; max-width: 38px; background: var(--track); border-radius: 5px; position: relative; height: 66px; overflow: hidden; }
  .weeks .wk-bar span { position: absolute; left: 0; right: 0; bottom: 0; background: var(--plan); border-radius: 5px; }
  .weeks .wk.current .wk-bar span { background: var(--plan-soft); }
  .weeks .wk.current .wk-label { color: var(--ink-2); font-weight: 600; }
  .weeks .wk-label { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
  .weeks .wk-val { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .range-bar { position: relative; height: 26px; margin: 8px 0 4px; }
  .range-bar .rb-track { position: absolute; left: 0; right: 0; top: 10px; height: 6px; border-radius: 3px; background: var(--track); }
  .range-bar .rb-band { position: absolute; top: 10px; height: 6px; border-radius: 3px; background: var(--plan-soft); }
  .range-bar .rb-now, .range-bar .rb-mid, .range-bar .rb-limit { position: absolute; top: 4px; width: 2px; height: 18px; margin-left: -1px; border-radius: 1px; }
  .range-bar .rb-now { background: var(--plan); }
  .range-bar .rb-mid { background: var(--ink); }
  .range-bar .rb-limit { background: var(--crit); }
  .range-labels { position: relative; height: 16px; font-size: 11px; color: var(--ink-3); }
  .range-labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .note { font-size: 12px; color: var(--ink-3); line-height: 1.5; }

  .sample-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); background: var(--hair); padding: 3px 8px; border-radius: 6px; font-weight: 600; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1180px) {
    .g-overview, .g-3-2 { grid-template-columns: minmax(0, 1fr); }
    /* One column: limits, then cost, then the chart and recent sessions. */
    .g-overview > .stack { display: contents; }
    .g-overview .ov-cost { order: 1; }
    .g-overview .ov-chart { order: 2; }
    .g-overview .ov-recent { order: 3; }
    .eff { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .eff > div:nth-child(4) { border-left: 0; }
    .eff > div:nth-child(n+4) { border-top: 1px solid var(--hair); }
    .eff.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .eff.four > div:nth-child(n) { border-left: 0; border-top: 0; }
    .eff.four > div:nth-child(even) { border-left: 1px solid var(--hair); }
    .eff.four > div:nth-child(n+3) { border-top: 1px solid var(--hair); }
    .activity-grid { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .heat-inner { min-width: 680px; }
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    .sidebar { position: sticky; z-index: 20; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; align-content: start; gap: 10px 14px; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--hair); overflow: visible; }
    .brand { padding: 0; }
    .brand-sub { display: none; }
    .nav { order: 3; flex-direction: row; overflow-x: auto; width: 100%; gap: 4px; margin: 0 -4px; padding: 0 4px 2px; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav a { flex: none; padding: 6px 10px; }
    .nav .count, .nav-alert, .nav-group, .nav-sep { display: none; }
    .side-foot { order: 2; margin: 0 0 0 auto; flex-direction: row; align-items: center; gap: 8px; padding: 0; }
    .side-foot .side-label, .side-foot .theme-block, .side-foot .sample-block, .sync-line { display: none; }
    .sync { padding: 0; background: none; }
    .sync-btn { margin: 0; padding: 5px 9px; }
    .main { padding: 18px 16px 48px; }
    .g-2, .window-grid { grid-template-columns: minmax(0, 1fr); }
    .window-grid > .window + .window { border-left: 0; border-top: 1px solid var(--hair); }
    .eff { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .eff > div:nth-child(n) { border-left: 0; border-top: 1px solid var(--hair); }
    .eff > div:nth-child(-n+2) { border-top: 0; }
    .eff > div:nth-child(even) { border-left: 1px solid var(--hair); }
    .cost-figure .big { font-size: 30px; }
    .share-row { grid-template-columns: minmax(0, 1fr) 80px; }
    .share-row .share-bar-cell { grid-column: 1 / -1; order: 3; }
    .budget-grid { grid-template-columns: minmax(0, 1fr); }
    .hide-sm { display: none; }
  }
  .no-motion *, .no-motion *::before, .no-motion *::after { transition: none !important; animation: none !important; }
  .settled .meter-fill, .settled .meter-proj, .settled .share-bar span { transition: none; }
  .settled .capacity span { transition: opacity 0.2s ease; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
  }

  /* ---------- Native macOS shell ----------
     The app adds html.native: the window's vibrancy shows through the
     sidebar, and colours come from the system (label, separator and accent
     colours), so the page follows Light/Dark, the accent colour and
     Increase Contrast exactly like an AppKit view. --native-window-bg is
     injected by the app (WebKit has no CSS keyword for it). */
  html.native { --side-w: 220px; }
  html.native body { background: transparent; }
  html.native .sidebar { background: transparent; border-right: 1px solid var(--hair); padding-top: 50px; }
  html.native .brand { display: none; }
  html.native .main { background: var(--ground); min-height: 100vh; padding-top: 42px; }
  html.native .nav a .icon { color: var(--plan); }
  html.native .nav a[aria-current="page"] { background: var(--nav-selected); }
  html.native .sync { background: var(--panel-2); }
  @supports (color: -apple-system-label) {
    html.native {
      color-scheme: light dark;
      --ground: var(--native-window-bg, #ececec);
      --panel: -apple-system-control-background;
      --panel-2: color-mix(in srgb, -apple-system-label 4%, var(--panel));
      --hair: -apple-system-separator;
      --hair-strong: -apple-system-container-border;
      --ink: -apple-system-label;
      --ink-2: -apple-system-secondary-label;
      --ink-3: -apple-system-secondary-label;
      --track: -apple-system-quaternary-label;
      --plan: -apple-system-control-accent;
      --plan-ink: -apple-system-control-accent;
      --plan-soft: color-mix(in srgb, -apple-system-control-accent 35%, var(--panel));
      --plan-wash: color-mix(in srgb, -apple-system-control-accent 14%, transparent);
      --nav-selected: color-mix(in srgb, -apple-system-label 9%, transparent);
      --warn: -apple-system-orange;
      --warn-ink: color-mix(in srgb, -apple-system-orange 72%, -apple-system-label);
      --warn-wash: color-mix(in srgb, -apple-system-orange 15%, transparent);
      --crit: -apple-system-red;
      --crit-ink: color-mix(in srgb, -apple-system-red 80%, -apple-system-label);
      --crit-wash: color-mix(in srgb, -apple-system-red 12%, transparent);
      --good-ink: -apple-system-green;
      --heat-0: -apple-system-quaternary-label;
      --heat-1: color-mix(in srgb, -apple-system-control-accent 28%, var(--panel));
      --heat-2: color-mix(in srgb, -apple-system-control-accent 52%, var(--panel));
      --heat-3: color-mix(in srgb, -apple-system-control-accent 78%, var(--panel));
      --heat-4: -apple-system-control-accent;
      --grid: -apple-system-separator;
      --axis: -apple-system-container-border;
      --tip: -apple-system-control-background;
    }
    @media (prefers-color-scheme: dark) {
      html.native {
        --ground: var(--native-window-bg, #1e1e1e);
        --panel: color-mix(in srgb, -apple-system-label 6%, var(--ground));
      }
    }
  }
  .loading-dots::after { content: "…"; }
</style>
</head>

<script>
"use strict";

/* ===================== Utilities ===================== */
const $ = (sel, root = document) => root.querySelector(sel);
const DAY = 86400000, HOUR = 3600000, MIN = 60000;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WEEKDAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6"];
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function usd(n, { cents } = {}) {
  n = Number(n) || 0;
  if (!cents && Math.abs(n) >= 1000) return "$" + Math.round(n).toLocaleString("en-US");
  return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function tokens(n) {
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 1 : 2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "K";
  return String(Math.round(n));
}
function int(n) { return Math.round(Number(n) || 0).toLocaleString("en-US"); }
function pct(n, d = 0) { return (Number(n) || 0).toFixed(d) + "%"; }
function clockTime(t) { return new Date(t).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }
function dayName(t) { return new Date(t).toLocaleDateString("en-US", { weekday: "short" }); }
function shortDate(t) { const d = new Date(t); return MONTHS[d.getMonth()] + " " + d.getDate(); }
function fullDate(t) { const d = new Date(t); return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }
function dayKey(t) { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function startOfDay(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function isToday(t) { return dayKey(t) === dayKey(Date.now()); }
function resetLabel(t) {
  // Reset times jitter by about a second around the minute; round to it.
  t = t + 30000;
  if (isToday(t)) return clockTime(t);
  return dayName(t) + " " + clockTime(t);
}
function duration(ms) {
  const m = Math.max(0, Math.round(ms / MIN));
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 48) return h + "h " + String(m % 60).padStart(2, "0") + "m";
  return (ms / DAY).toFixed(1) + " days";
}
function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 7) return Math.round(s / 86400) + "d ago";
  return shortDate(t);
}
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function niceMax(v) {
  if (v <= 0) return 10;
  const m = Math.pow(10, Math.floor(Math.log10(v)));
  const r = v / m;
  // Axes tick at 0, half and max, so every step must halve cleanly.
  return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 4 ? 4 : r <= 5 ? 5 : r <= 6 ? 6 : r <= 8 ? 8 : 10) * m;
}
function load(key, fallback) { try { return localStorage.getItem(key) ?? fallback; } catch (e) { return fallback; } }
function save(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function glyph(source, cls = "glyph") {
  return `<svg class="icon ${cls}" aria-hidden="true"><use href="#g-${source === "codex" ? "codex" : "claude"}"/></svg>`;
}
function icon(id, extra = "") { return `<svg class="icon" ${extra} aria-hidden="true"><use href="#i-${id}"/></svg>`; }
const SOURCE_LABEL = { claude: "Claude", codex: "Codex" };

/* ===================== Data =====================
   Everything comes from the app's own backend over the app:// scheme. */
const PERIODS = [["1d", 1, "24 hours"], ["3d", 3, "3 days"], ["7d", 7, "7 days"], ["2w", 14, "2 weeks"], ["1m", 30, "30 days"], ["3m", 90, "90 days"], ["6m", 180, "180 days"], ["1y", 365, "365 days"]];
const TOKEN_TYPES = [["input", "Input"], ["output", "Output"], ["cache_read", "Cache read"], ["cache_write", "Cache write"]];

const state = {
  view: "overview",
  source: load("usage-source", "all"),
  period: load("usage-period", "7d"),
  query: "", sort: { key: "end_ts", dir: -1 }, selected: null, limit: 40,
  data: null, sessions: null, error: null, loading: false,
  transcriptId: null, transcript: null, turnSort: "order", expanded: new Set(), showCarried: false,
  settings: null, settingsSource: "claude", settingsError: null, saveState: "", showAllPrices: false, openGroups: new Set(),
};
if (!["all", "claude", "codex"].includes(state.source)) state.source = "all";
if (!PERIODS.some(p => p[0] === state.period)) state.period = "7d";
const devParams = new URLSearchParams(location.search);
if (devParams.get("motion") === "off") document.documentElement.classList.add("no-motion");
if (["light", "dark"].includes(devParams.get("theme"))) document.documentElement.dataset.theme = devParams.get("theme");

async function api(path, options) {
  const res = await fetch(path, { cache: "no-store", ...options });
  const body = await res.json();
  if (!res.ok || body.error) throw new Error(body.error || "HTTP " + res.status);
  return body;
}

function ms(v) { return v == null ? null : typeof v === "number" ? v : Date.parse(v); }
function withSessions(r) { return { ...r, sessions: r.session_count ?? 0 }; }
function normSession(s) {
  const models = (s.models || "").split(",").filter(m => m && m !== "<synthetic>").join(",");
  return { ...s, start_ts: ms(s.start_ts), end_ts: ms(s.end_ts), models };
}

function adaptWindow(w) {
  if (!w) return null;
  const c = w.credit;
  return {
    start: ms(w.start), end: ms(w.end), pct: w.pct ?? null, cost: w.cost || 0, buckets: w.buckets || null,
    prev_cost: w.prev_cost || 0, estimated: !!w.estimated,
    credit: c ? { available: !!c.available, total: c.estimated_total_dollars, points: c.points, needed: c.points_needed } : null,
  };
}

function adaptForecast(f) {
  if (!f) return null;
  if (!f.available) return { unavailable: f.reason || "" };
  const raw = f.projected_final_raw ?? f.projected_final_percentage;
  return {
    projected: Math.min(100, raw), projected_raw: raw,
    low: f.projected_low_raw ?? f.projected_final_low ?? raw, high: f.projected_high_raw ?? f.projected_final_high ?? raw,
    exhaustion_at: ms(f.exhaustion_at), earliest: ms(f.exhaustion_at_earliest), latest: ms(f.exhaustion_at_latest),
    method: f.method, reference_weeks: f.reference_weeks, typical_error: f.typical_error_pp, burn_per_day: f.burn_rate_pct_per_day,
  };
}

function adaptLimits(l) {
  const now = Date.now();
  const five = adaptWindow(l.five_hour), weekly = adaptWindow(l.weekly);
  const history = (l.history || []).map(h => ({ start: ms(h.start), end: ms(h.end), v: h.peak ?? 0 }))
    .filter(h => h.end <= now).sort((a, b) => a.start - b.start).slice(-8)
    .map(h => ({ v: h.v, label: shortDate(h.start) }));
  return {
    status: l.status, error: l.error, synced_at: ms(l.synced_at), five_hour: five, weekly,
    forecast: weekly ? adaptForecast(l.forecast) : null, history,
    credit: { five_hour: five?.credit, weekly: weekly?.credit },
    budgets: (l.budgets || []).map(b => ({ ...b, start: ms(b.start), end: ms(b.end) })),
  };
}

function adaptDashboard(d) {
  return {
    generated_at: ms(d.generated_at),
    period: withSessions(d.period),
    by_source: d.by_source.map(withSessions),
    by_model: d.by_model.filter(m => m.model !== "<synthetic>").map(withSessions),
    by_group: d.by_group || [],
    by_project: d.by_project.map(withSessions),
    daily: d.daily,
    longest: d.longest_session ? normSession(d.longest_session) : null,
    recent: d.recent_sessions.map(normSession),
    session_total: d.session_total,
    activity: d.activity,
    limits: { claude: adaptLimits(d.limits.claude), codex: adaptLimits(d.limits.codex) },
  };
}

async function refresh() {
  state.loading = true;
  try {
    const days = periodDays();
    state.data = adaptDashboard(await api(`/api/app/dashboard?source=${state.source}&days=${days}`));
    if (state.view === "transcript" && state.transcriptId) await loadTranscript(state.transcriptId, true);
    if (state.view === "sessions" || state.sessions) {
      state.sessions = (await api(`/api/all-sessions?source=${state.source}`)).sessions.map(normSession);
    }
    if (state.view === "settings") {
      const rev = settingsRev;
      const settings = await api(`/api/app/settings?source=${state.settingsSource}`);
      if (rev === settingsRev) state.settings = settings;
    }
    state.error = null;
    retries = 0;
  } catch (e) {
    state.error = String(e.message || e);
    // Until the first data arrives, retry quickly instead of waiting for the
    // 60-second refresh.
    if (!state.data && retries < 5) setTimeout(refresh, 1000 * 2 ** retries++);
  }
  state.loading = false;
  render();
}
let retries = 0;

async function loadTranscript(id, quiet = false) {
  if (!quiet) state.transcript = { id, loading: true };
  try {
    const data = await api(`/api/app/transcript?id=${encodeURIComponent(id)}`);
    if (state.transcriptId === id) state.transcript = { id, data };
  } catch (e) {
    if (!quiet && state.transcriptId === id) state.transcript = { id, error: String(e.message || e) };
  }
  if (!quiet) render();
}

function sourcesShown() { return state.source === "all" ? ["claude", "codex"] : [state.source]; }
function periodDays() { return PERIODS.find(p => p[0] === state.period)[1]; }
function periodLabel() { return "Last " + PERIODS.find(p => p[0] === state.period)[2]; }

/* Calendar days ending today, built from local dates so DST never skips
   or repeats a day. */
function lastDays(n, now = Date.now()) {
  const today = new Date(now);
  return Array.from({ length: n }, (_, i) => new Date(today.getFullYear(), today.getMonth(), today.getDate() - (n - 1 - i)).getTime());
}

/* Session naming: the title Claude Code / Codex recorded, else the first
   prompt, else a clearly-untitled fallback that still identifies it. */
function sessionName(s) {
  if (s.title) return { text: s.title, html: esc(s.title), kind: "title" };
  if (s.first_prompt) {
    const p = s.first_prompt.length > 80 ? s.first_prompt.slice(0, 78).trimEnd() + "…" : s.first_prompt;
    return { text: p, html: `<span class="q">“</span>${esc(p)}<span class="q">”</span>`, kind: "prompt" };
  }
  const text = `Untitled · ${s.project} · ${shortDate(s.start_ts)}, ${clockTime(s.start_ts)}`;
  return { text, html: esc(text), kind: "untitled" };
}

/* ===================== Tooltip ===================== */
const tip = $("#tip");
const tips = new Map();
let tipSeq = 0;
function tipAttr(html) { const id = "t" + (++tipSeq); tips.set(id, html); return `data-tip="${id}"`; }
function placeTip(e) {
  const pad = 14, rect = tip.getBoundingClientRect();
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + rect.width > innerWidth - 8) x = e.clientX - rect.width - pad;
  if (y + rect.height > innerHeight - 8) y = e.clientY - rect.height - pad;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.max(8, y) + "px";
}
document.addEventListener("pointerover", e => {
  const el = e.target.closest("[data-tip]");
  if (!el || !tips.has(el.dataset.tip)) return;
  tip.innerHTML = tips.get(el.dataset.tip);
  tip.classList.add("on");
  placeTip(e);
});
document.addEventListener("pointermove", e => { if (tip.classList.contains("on")) placeTip(e); });
document.addEventListener("pointerout", e => {
  const el = e.target.closest("[data-tip]");
  if (el && !el.contains(e.relatedTarget)) tip.classList.remove("on");
});
function tipRows(title, rows) {
  return `<div class="t">${esc(title)}</div>` + rows.map(([k, v, color]) =>
    `<div class="r"><span>${color ? `<i style="background:var(${color})"></i>` : ""}${esc(k)}</span><b>${esc(v)}</b></div>`).join("");
}

/* ===================== Motion ===================== */
// Meters, capacity bars and share bars fill in once, on the first load.
// Every later render (period, source, sync) shows the new values at once.
let filledOnce = false;
function settle(root) {
  const apply = () => {
    root.querySelectorAll("[data-w]").forEach(el => { el.style.width = el.dataset.w; });
    root.querySelectorAll("[data-fg]").forEach(el => { el.style.flexGrow = el.dataset.fg; });
  };
  if (filledOnce) { apply(); return; }
  filledOnce = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    apply();
    setTimeout(() => document.documentElement.classList.add("settled"), 1000);
  }));
}

/* ===================== Components ===================== */
function level(p) { return p >= 90 ? "crit" : p >= 75 ? "warn" : "ok"; }

function meterHTML(name, w, kind, src) {
  const now = Date.now();
  if (w.pct == null) {
    // No percentage reported (the provider's API is unreachable): show the
    // locally estimated window and its cost, without pretending to a fill.
    return `
    <div class="meter" data-level="ok">
      <div class="meter-head"><span class="meter-name">${esc(name)}</span><span class="meter-value"><b>${usd(w.cost)}</b> so far</span></div>
      <div class="meter-foot"><span>Resets around <b>${esc(resetLabel(w.end))}</b> · window estimated from your logs</span><span>No usage % reported yet</span></div>
    </div>`;
  }
  const lvl = level(w.pct);
  const fc = kind === "weekly" && src.forecast && !src.forecast.unavailable ? src.forecast : null;
  const fcNote = kind === "weekly" && src.forecast?.unavailable ? forecastReason(src.forecast.unavailable) : "";
  const ticks = kind === "weekly" ? 7 : 5;
  const elapsed = Math.min(1, Math.max(0, (now - w.start) / (w.end - w.start)));
  const proj = fc ? Math.min(100, fc.projected_raw) : 0;
  const badge = lvl === "crit" ? `<span class="lvl crit">${icon("alert")}Almost out</span>`
              : lvl === "warn" ? `<span class="lvl warn">${icon("alert")}High</span>` : "";
  const timeTip = tipAttr(tipRows(name, [
    ["Used", pct(w.pct)], ["Time elapsed", pct(elapsed * 100)],
    ...(fc ? [["Projected at reset", pct(fc.projected_raw)]] : []),
    ["Resets", resetLabel(w.end)],
  ]));
  let forecast = "";
  if (fc) {
    const flat = fc.method === "flat" ? " Rough estimate: fewer than three past weeks to compare against." : "";
    if (fc.exhaustion_at && fc.exhaustion_at < w.end) {
      const before = duration(w.end - fc.exhaustion_at);
      forecast = `<div class="forecast crit">${icon("alert")}<div>On pace to run out <b>${esc(resetLabel(fc.exhaustion_at))}</b>, ${esc(before)} before it resets.${flat}</div></div>`;
    } else if (fc.projected >= 75) {
      forecast = `<div class="forecast warn">${icon("alert")}<div>On pace to finish the week near <b>${pct(fc.projected)}</b>.${flat}</div></div>`;
    } else {
      forecast = `<div class="forecast">${icon("info")}<div>On pace to finish the week around <b>${pct(fc.projected)}</b> (${pct(Math.min(100, fc.low))}–${pct(Math.min(100, fc.high))}).${flat}</div></div>`;
    }
  } else if (fcNote) {
    forecast = `<div class="forecast">${icon("info")}<div>${esc(fcNote)}</div></div>`;
  }
  const tickMarks = Array.from({ length: ticks - 1 }, (_, i) => `<i style="left:${((i + 1) / ticks) * 100}%"></i>`).join("");
  return `
    <div class="meter" data-level="${lvl}" ${fc && fc.projected_raw > 100 ? 'data-proj="over"' : ""}>
      <div class="meter-head">
        <span class="meter-name">${esc(name)}</span>
        <span class="meter-value">${badge}<b>${Math.round(w.pct)}%</b> used</span>
      </div>
      <div class="meter-wrap" ${timeTip}>
        <div class="meter-bar" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(w.pct)}" aria-label="${esc(name)} used">
          ${fc ? `<div class="meter-proj" data-w="${proj}%"></div>` : ""}
          <div class="meter-fill" data-w="${Math.min(100, w.pct)}%"></div>
          <div class="meter-ticks">${tickMarks}</div>
        </div>
        <div class="meter-now" style="left:${elapsed * 100}%" title="Time elapsed in this window"></div>
      </div>
      <div class="meter-foot">
        <span>Resets in <b>${esc(duration(w.end - now))}</b> · ${esc(resetLabel(w.end))}</span>
        <span>${usd(w.cost)} at API rates</span>
      </div>
      ${forecast}
    </div>`;
}

const BUDGET_LABEL = { day: "Daily budget", week: "Weekly budget", month: "Monthly budget" };

/* A spending limit the person set: the same meter as a plan limit, in
   dollars, over the current calendar day, week or month. */
function budgetMeterHTML(b) {
  const now = Date.now(), lvl = level(b.pct), name = BUDGET_LABEL[b.period];
  const elapsed = Math.min(1, Math.max(0, (now - b.start) / (b.end - b.start)));
  const badge = lvl === "crit" ? `<span class="lvl crit">${icon("alert")}Almost out</span>`
              : lvl === "warn" ? `<span class="lvl warn">${icon("alert")}High</span>` : "";
  const resets = b.end - now > 6 * DAY ? shortDate(b.end) : resetLabel(b.end);
  const tipHTML = tipAttr(tipRows(name, [["Spent", usd(b.cost)], ["Budget", usd(b.limit)], ["Used", pct(b.pct)], ["Time elapsed", pct(elapsed * 100)], ["Resets", resets]]));
  return `
    <div class="meter" data-level="${lvl}">
      <div class="meter-head">
        <span class="meter-name">${esc(name)}</span>
        <span class="meter-value">${badge}<b>${usd(b.cost)}</b> of ${usd(b.limit)}</span>
      </div>
      <div class="meter-wrap" ${tipHTML}>
        <div class="meter-bar" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(b.pct)}" aria-label="${esc(name)} used">
          <div class="meter-fill" data-w="${Math.min(100, b.pct)}%"></div>
        </div>
        <div class="meter-now" style="left:${elapsed * 100}%" title="Time elapsed in this period"></div>
      </div>
      <div class="meter-foot">
        <span>Resets in <b>${esc(duration(b.end - now))}</b> · ${esc(resets)}</span>
        <span>${pct(b.pct)} used</span>
      </div>
    </div>`;
}

function budgetPanel(source) {
  const budgets = state.data.limits[source].budgets;
  if (!budgets.length) return "";
  return `<div class="panel"><div class="source-head">${glyph(source)}<span class="name">${SOURCE_LABEL[source]} budgets</span><span class="aside"><button class="link-btn" data-go="settings">Edit</button></span></div>
    <div class="rows">${budgets.map(budgetMeterHTML).join("")}</div></div>`;
}

function forecastReason(reason) {
  if (/^only /.test(reason)) return "A forecast appears 12 hours into the week.";
  if (/no weekly window/.test(reason)) return "No weekly window in progress.";
  return reason.charAt(0).toUpperCase() + reason.slice(1) + ".";
}

function syncAside(src) {
  if (src.status === "ok") return `Synced ${ago(src.synced_at)}`;
  if (src.status === "error") return "Sync failed";
  return "";
}

function allowancePanel(source) {
  const src = state.data.limits[source];
  const head = `<div class="source-head">${glyph(source)}<span class="name">${SOURCE_LABEL[source]}</span>${src.plan ? `<span class="plan">${esc(src.plan)}</span>` : ""}<span class="aside">${esc(syncAside(src))}</span></div>`;
  const budgetRows = src.budgets.map(budgetMeterHTML);
  // Billed per token: no plan limits to report, so the budgets lead.
  if (budgetRows.length && !src.five_hour && !src.weekly) {
    return `<div class="panel"><div class="source-head">${glyph(source)}<span class="name">${SOURCE_LABEL[source]}</span><span class="plan">Your budgets</span><span class="aside"><button class="link-btn" data-go="settings">Edit</button></span></div>
      <div class="rows">${budgetRows.join("")}</div></div>`;
  }
  if (src.status === "waiting") {
    return `<div class="panel">${head}<div class="empty-state"><h3>Waiting for the first sync</h3>
      Limits come straight from Anthropic, using the login Claude Code already keeps in your Keychain.
      <ol><li>Install Claude Code and sign in once (<code>claude</code>).</li><li>Choose <b>Sync now</b>, or wait up to 10 minutes.</li></ol></div></div>`;
  }
  if (src.status === "error" && !src.five_hour && !src.weekly) {
    return `<div class="panel">${head}<div class="empty-state"><h3>Couldn't reach ${SOURCE_LABEL[source]}</h3>${esc(src.error || "")}
      <p style="margin:8px 0 0">The dashboard keeps trying every 10 minutes. You can also choose <b>Sync now</b>.</p></div></div>`;
  }
  if (src.status === "missing") {
    return `<div class="panel">${head}<div class="empty-state"><h3>Codex CLI not found</h3>
      Install the Codex CLI and sign in with a ChatGPT plan to see its weekly limit here. Cost tracking starts with your first Codex session.</div></div>`;
  }
  const rows = [];
  if (src.status === "error") rows.push(`<div class="empty-state" style="padding:12px 18px 0;color:var(--crit-ink)">Last sync failed: ${esc(src.error || "")}</div>`);
  if (src.five_hour) rows.push(meterHTML("5-hour window", src.five_hour, "five_hour", src));
  if (src.weekly) rows.push(meterHTML("Weekly limit", src.weekly, "weekly", src));
  rows.push(...budgetRows);
  return `<div class="panel">${head}<div class="rows">${rows.join("")}</div></div>`;
}

function capacityHTML(parts, total, key) {
  // parts: [{label, value, color, sub}] — the legend doubles as direct labels.
  const segs = parts.map((p, i) => `<span class="cap-seg" data-i="${i}" data-fg="${total ? p.value / total : 0}" style="background:var(${p.color})" ${tipAttr(tipRows(p.label, [["Cost", usd(p.value)], ["Share", pct(total ? p.value / total * 100 : 0, 1)], ...(p.sub ? [[p.sub[0], p.sub[1]]] : [])]))}></span>`).join("");
  const legend = parts.map((p, i) => `<li data-i="${i}"><span class="sw" style="background:var(${p.color})"></span><span class="nm">${esc(p.label)}</span><span class="vl">${usd(p.value)}</span><span class="sh">${pct(total ? p.value / total * 100 : 0)}</span></li>`).join("");
  return `<div class="capacity" data-cap="${key}">${segs}</div><ul class="legend" data-cap="${key}">${legend}</ul>`;
}
// Hovering a segment or its legend row isolates the pair.
document.addEventListener("pointerover", e => {
  const item = e.target.closest(".capacity [data-i], .legend[data-cap] li");
  document.querySelectorAll(".lit").forEach(el => el.classList.remove("lit"));
  if (!item) return;
  const key = item.parentElement.dataset.cap, i = item.dataset.i;
  document.querySelectorAll(`[data-cap="${key}"] [data-i="${i}"]`).forEach(el => el.classList.add("lit"));
  if (item.tagName === "LI") $(`.capacity[data-cap="${key}"]`)?.classList.add("focus");
});
document.addEventListener("pointerout", e => {
  if (!e.relatedTarget || !e.relatedTarget.closest?.(".legend[data-cap]")) document.querySelectorAll(".capacity.focus").forEach(el => el.classList.remove("focus"));
});

function foldParts(list, labelOf, max = 5) {
  const parts = list.slice(0, max).map((m, i) => ({ label: labelOf(m), value: m.cost, color: SERIES[i] }));
  const rest = list.slice(max).reduce((a, m) => a + m.cost, 0);
  if (rest > 0) parts.push({ label: `Other (${list.length - max})`, value: rest, color: "--ink-3" });
  return parts;
}

function deltaHTML(cur, prev, days) {
  if (!prev) return `<span class="delta"><span class="vs">no earlier ${days === 1 ? "day" : "period"} to compare</span></span>`;
  const d = (cur - prev) / prev * 100;
  const up = d >= 0;
  return `<span class="delta ${up ? "up" : "down"}">${up ? "+" : "−"}${pct(Math.abs(d))} <span class="vs">vs previous ${PERIODS.find(p => p[1] === days)[2]}</span></span>`;
}

/* Bar charts are drawn after layout so they can measure their width. */
const charts = [];
function chartSlot(cfg) { charts.push(cfg); return `<div class="chart${cfg.fill ? " fill" : ""}" id="chart-${charts.length - 1}"></div>`; }
function drawCharts() {
  charts.forEach((cfg, i) => { const el = document.getElementById("chart-" + i); if (el) drawBars(el, cfg); });
}
let lastWidth = 0;
new ResizeObserver(() => {
  const w = $("#main").clientWidth;
  if (lastWidth && Math.abs(w - lastWidth) > 4 && state.data) { lastWidth = w; render(); }
  else lastWidth = w;
}).observe($("#main"));

function axisUsd(v) {
  if (v === 0) return "$0";
  if (v >= 1000) return "$" + (v / 1000).toFixed(v % 1000 ? 1 : 0) + "K";
  return v >= 10 ? "$" + Math.round(v) : "$" + v.toFixed(v % 1 ? 2 : 0);
}

function topRounded(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function drawBars(el, { items, keys, height = 190, fill, labelOf, tipOf, attrOf }) {
  const W = Math.max(280, el.clientWidth), H = fill ? Math.max(170, el.clientHeight) : height, padL = 46, padB = 24, padT = 8;
  const plotW = W - padL, plotH = H - padB - padT;
  const totals = items.map(it => keys.reduce((a, k) => a + (it[k[0]] || 0), 0));
  const max = niceMax(Math.max(...totals, 0.01));
  const slot = plotW / items.length, bw = Math.max(3, Math.min(26, slot * 0.64));
  const every = Math.max(1, Math.ceil(items.length / Math.max(3, Math.floor(plotW / 70))));
  let svg = "";
  for (let g = 0; g <= 2; g++) {
    const y = padT + plotH - (plotH * g) / 2;
    svg += `<line class="${g ? "gridline" : "baseline"}" x1="${padL}" x2="${W}" y1="${y}" y2="${y}"/>`;
    svg += `<text class="tick" x="${padL - 8}" y="${y + 4}" text-anchor="end">${esc(axisUsd((max * g) / 2))}</text>`;
  }
  items.forEach((it, i) => {
    const cx = padL + slot * i + slot / 2, x = cx - bw / 2;
    let y = padT + plotH, segs = "";
    const nonzero = keys.filter(k => it[k[0]] > 0);
    nonzero.forEach((k, j) => {
      const h = (it[k[0]] / max) * plotH;
      const gap = j < nonzero.length - 1 && h > 3 ? 2 : 0;
      const top = y - h;
      segs += j === nonzero.length - 1
        ? `<path class="bar" d="${topRounded(x, top, bw, h - gap * 0, 4)}" style="fill:var(${k[2]})"/>`
        : `<rect class="bar" x="${x}" y="${top + gap}" width="${bw}" height="${Math.max(0, h - gap)}" style="fill:var(${k[2]})"/>`;
      y = top;
    });
    const label = i % every === 0 ? `<text class="tick" x="${cx}" y="${H - 6}" text-anchor="middle">${esc(labelOf(it))}</text>` : "";
    svg += `<g class="col" ${attrOf ? attrOf(it) : ""} ${tipAttr(tipOf(it))}><rect class="hit" x="${padL + slot * i}" y="${padT}" width="${slot}" height="${plotH}" rx="4"/>${segs}${label}</g>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${svg}</svg>`;
}

function seriesForPeriod(days, now) {
  // Daily bars up to 90 days; weekly beyond, so bars stay readable.
  const byDay = new Map((state.data.daily || []).map(d => [d.day, d]));
  const daily = lastDays(Math.max(days, 7), now).map(t => {
    const d = byDay.get(dayKey(t)) || {};
    return { t, cost: d.cost || 0, message_count: d.message_count || 0, sessions: d.session_count || 0,
             cost_input: d.cost_input || 0, cost_output: d.cost_output || 0, cost_cache_read: d.cost_cache_read || 0, cost_cache_write: d.cost_cache_write || 0 };
  });
  if (days <= 90) return { items: daily, unit: "day" };
  const weeks = [];
  for (let i = daily.length; i > 0; i -= 7) {
    const chunk = daily.slice(Math.max(0, i - 7), i);
    const e = { t: chunk[0].t, end: chunk[chunk.length - 1].t, cost: 0, message_count: 0, cost_input: 0, cost_output: 0, cost_cache_read: 0, cost_cache_write: 0, sessions: 0 };
    chunk.forEach(c => { for (const k of Object.keys(e)) if (k !== "t" && k !== "end") e[k] += c[k]; });
    weeks.unshift(e);
  }
  return { items: weeks, unit: "week" };
}

function periodSeg() {
  return `<div class="seg period" role="group" aria-label="Period">${PERIODS.map(([k, , label]) =>
    `<button data-period="${k}" aria-pressed="${k === state.period}" title="Last ${label}">${k}</button>`).join("")}</div>`;
}

function viewHead(title, sub, right = "") {
  return `<div class="view-head"><div><h1>${esc(title)}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div>${right}</div>`;
}

function sessionRow(s) {

  return `<div class="list-row session-row" data-session="${esc(s.session_id)}">
    ${glyph(s.source)}
    <div style="min-width:0"><div class="s-name ${n.kind === "untitled" ? "untitled" : ""}">${n.html}</div>
    <div class="s-meta">${esc(s.project)} · ${int(s.message_count)} messages · ${esc(s.models.split(",")[0])}</div></div>
    <div><div class="s-cost">${usd(s.cost)}</div><div class="s-when">${esc(ago(s.end_ts))}</div></div>
  </div>`;
}

let overviewRecent = [];
// Both overview columns end level: whichever is shorter gets filled with
// real content — more recent sessions on the right (whole rows only), or a
// taller cost chart on the left (it draws to whatever height it's given).
function fillOverview() {
  const grid = $(".g-overview");
  const list = $("#recent-rows");
  if (!grid || !list || !list.firstElementChild?.classList.contains("session-row")) return;
  if (getComputedStyle(grid).gridTemplateColumns.split(" ").length < 2) {
    list.insertAdjacentHTML("beforeend", overviewRecent.slice(3, 5).map(sessionRow).join(""));
    return;
  }
  grid.style.alignItems = "start";
  const [left, right] = [...grid.children].map(c => c.getBoundingClientRect().height);
  grid.style.alignItems = "";
  const rowH = list.firstElementChild.getBoundingClientRect().height;
  // Round up: a partial row's worth of space goes to the chart, which
  // grows to match, rather than staying empty under the list.
  const add = Math.max(0, Math.ceil((left - right) / rowH));
  list.insertAdjacentHTML("beforeend", overviewRecent.slice(3, 3 + add).map(sessionRow).join(""));
}

/* Per-source cost. Sources are told apart by glyph and name, never by hue,
   so the split uses the neutral plan-blue share bar. */

}

function sourceCostPanel(st, total, days) {

views.limits = () => {
  const shown = sourcesShown();
  const blocks = shown.map(source => {
    const src = state.data.limits[source];
    if (!src.five_hour && !src.weekly) return allowancePanel(source);
    const kinds = [["five_hour", "5-hour window"], ["weekly", "Weekly limit"]].filter(([k]) => src[k]);
    const windows = kinds.map(([k, name]) => {
      const w = src[k];
      const credit = src.credit?.[k];
      const cols = k === "five_hour" ? 5 : 7;
      const vals = w.buckets || Array.from({ length: cols }, () => null);
      const maxB = Math.max(...vals.map(v => v || 0), 0.01);
      const bars = vals.map((v, i) => {
        const t = w.start + i * (k === "five_hour" ? HOUR : DAY);
        const label = k === "five_hour" ? clockTime(t).replace(":00", "") : dayName(t);
        return `<div class="mcol" ${tipAttr(tipRows(k === "five_hour" ? clockTime(t) + "–" + clockTime(t + HOUR) : fullDate(t), [["Cost", v == null ? "—" : usd(v)]]))}><div class="mbar ${v == null ? "future" : ""}" style="height:${v == null ? 2 : Math.max(2, (v / maxB) * 100)}%"></div></div>`;
      }).join("");
      const labels = vals.map((_, i) => { const t = w.start + i * (k === "five_hour" ? HOUR : DAY); return `<span>${esc(k === "five_hour" ? clockTime(t).replace(":00", "") : dayName(t))}</span>`; }).join("");
      const prevDelta = w.prev_cost ? ` <span class="delta">${w.cost > w.prev_cost ? "+" : "−"}${pct(Math.abs((w.cost - w.prev_cost) / w.prev_cost * 100))}</span>` : "";
      return `<div class="window">${meterHTML(name, w, k, src)}
        ${w.buckets ? `<div class="mini">${bars}</div><div class="mini-x">${labels}</div>` : `<div class="note" style="padding:4px 18px 0">${SOURCE_LABEL[source]} reports this window as a rolling 7 days, so there's no per-day split.</div>`}
        <div class="window-facts">
          <div><div class="stat-k">Previous window</div><div class="stat-v">${w.prev_cost ? usd(w.prev_cost) : "No usage"}${prevDelta}</div></div>
          <div><div class="stat-k">Full allowance, at API rates</div><div class="stat-v">${credit?.available ? "≈ " + usd(credit.total) : credit ? `<span class="muted" style="font-weight:500">After ${credit.needed - credit.points} more syncs</span>` : "—"}</div></div>

  const forecasts = shown.map(source => {

    const at = v => (Math.min(v, scaleMax) / scaleMax) * 100;
    const runsOut = fc.exhaustion_at && fc.exhaustion_at < w.end;

      <div class="panel">

        <div class="panel-body">
          <div class="cost-figure"><span class="big num">${pct(fc.projected_raw > 100 ? fc.projected_raw : fc.projected)}</span><span class="delta"><span class="vs">projected at reset · now ${pct(w.pct)}</span></span></div>
          <div class="range-bar" ${tipAttr(tipRows("Projected at reset", [["Likely", pct(fc.projected_raw)], ["Range", pct(fc.low) + "–" + pct(highRaw)], ["Now", pct(w.pct)]]))}>
            <div class="rb-track"></div>
            <div class="rb-band" style="left:${at(fc.low)}%;width:${at(highRaw) - at(fc.low)}%"></div>
            <div class="rb-now" style="left:${at(w.pct)}%"></div>
            <div class="rb-mid" style="left:${at(fc.projected_raw)}%"></div>
            <div class="rb-limit" style="left:${at(100)}%"></div>
          </div>
          <div class="range-labels"><span style="left:${at(w.pct)}%">Now</span>${Math.abs(at(fc.projected_raw) - at(100)) > 8 ? `<span style="left:${at(100)}%">Limit</span>` : ""}<span style="left:${at(fc.projected_raw)}%">Likely</span></div>
          <div class="kv" style="margin-top:12px">
            <dt>Runs out</dt><dd>${runsOut ? `<b>${esc(resetLabel(fc.exhaustion_at))}</b>${fc.earliest && fc.latest ? ` <span class="muted">(${esc(resetLabel(fc.earliest))} – ${esc(resetLabel(fc.latest))})</span>` : ""}` : "Not at this pace"}</dd>
            <dt>Resets</dt><dd>${esc(resetLabel(w.end))} <span class="muted">· in ${esc(duration(w.end - Date.now()))}</span></dd>
            <dt>Burn rate</dt><dd>${pct(fc.burn_per_day, 1)} of the limit per day</dd>
            ${fc.typical_error ? `<dt>Accuracy</dt><dd>Usually within ±${fc.typical_error.toFixed(0)} points by this point in the week</dd>` : ""}
          </div>
          ${fc.method === "shape" ? "" : `<p class="note" style="margin:12px 0 0">Scales today's usage by the time elapsed. It sharpens after three full weeks of history.</p>`}
        </div>
      </div>
      <div class="panel weeks-panel">
        <div class="panel-head"><div class="panel-title">${SOURCE_LABEL[source]} past weeks</div><div class="panel-aside">Peak usage per week</div></div>
        <div class="panel-body" style="padding-top:18px">
          <div class="weeks">${weeks.map(k => `<div class="wk ${k.current ? "current" : ""}" ${tipAttr(tipRows(k.current ? "This week so far" : "Week of " + k.label, [["Peak", pct(k.v)]]))}><span class="wk-val">${Math.round(k.v)}%</span><div class="wk-bar"><span style="height:${Math.min(100, k.v)}%"></span></div><span class="wk-label">${esc(k.label)}</span></div>`).join("")}</div>
        </div>
      </div>
    </div>`;
  }).join("");

  const synced = shown.map(s => state.data.limits[s]).filter(s => s.status === "ok" || s.status === "error");
  const hasBudgets = shown.some(s => state.data.limits[s].budgets.length);
  const budgetLink = hasBudgets ? "" : `<button class="link-btn" data-go="settings">Billed per token? Set a budget</button>`;
  return viewHead("Limits", synced.length ? "Reported by the providers themselves · synced every 10 minutes" : "Not synced yet", budgetLink) + blocks + forecasts;
};

function quantileLevels(values) {
  const nz = values.filter(v => v > 0).sort((a, b) => a - b);
  const q = f => nz[Math.min(nz.length - 1, Math.floor(nz.length * f))] || 0;
  const cuts = [q(0.25), q(0.55), q(0.85)];
  return v => (v <= 0 ? 0 : v <= cuts[0] ? 1 : v <= cuts[1] ? 2 : v <= cuts[2] ? 3 : 4);
}

function activityPanel() {
  const now = Date.now();
  // Noon anchors keep day stepping correct across DST changes.
  const today = startOfDay(now) + 12 * HOUR;
  let start = today - 364 * DAY;
  start -= ((new Date(start).getDay() + 6) % 7) * DAY;
  const act = state.data.activity || { days: [], hour_weekday: [] };
  const byDay = new Map(act.days.map(d => [d.day, { cost: d.cost, message_count: d.message_count, sessions: d.session_count }]));
  const hw = Array.from({ length: 7 }, () => new Array(24).fill(0));
  for (const r of act.hour_weekday) if (r.weekday >= 0 && r.weekday < 7 && r.hour >= 0 && r.hour < 24) hw[r.weekday][r.hour] += r.cost;
  const wdCost = hw.map(row => row.reduce((a, v) => a + v, 0));
  const hasActivity = byDay.size > 0;
  const lv = quantileLevels([...byDay.values()].map(e => e.cost));
  let cells = "", months = "", lastMonth = -1, col = 0, active = 0, streak = 0, best = 0;
  const cols = Math.ceil((today - start) / DAY / 7) + 1;
  for (let t = start; t <= today + 6 * DAY; t += DAY) {
    const d = new Date(t), wd = (d.getDay() + 6) % 7;
    if (wd === 0) {
      if (d.getMonth() !== lastMonth && t <= today) { months += `<span style="left:${(col / cols) * 100}%">${MONTHS[d.getMonth()]}</span>`; lastMonth = d.getMonth(); }
      col++;
    }
    if (t > today) { cells += `<i class="out"></i>`; continue; }
    const e = byDay.get(dayKey(t));
    if (e) { active++; streak++; best = Math.max(best, streak); } else streak = 0;
    cells += `<i style="background:var(--heat-${lv(e?.cost || 0)})" ${tipAttr(tipRows(fullDate(t), e ? [["Cost", usd(e.cost)], ["Messages", int(e.message_count)], ["Sessions", int(e.sessions)]] : [["No activity", ""]]))}></i>`;
  }
  const hwLv = quantileLevels(hw.flat());
  const hours = `<span></span>` + Array.from({ length: 24 }, (_, h) => `<span class="hl">${h % 3 === 0 ? (h === 0 ? "12a" : h < 12 ? h + "a" : h === 12 ? "12p" : h - 12 + "p") : ""}</span>`).join("");
  const grid = WEEKDAYS.map((wd, r) => `<span>${wd}</span>` + hw[r].map((v, h) => `<i style="background:var(--heat-${hwLv(v)})" ${tipAttr(tipRows(`${wd} ${h}:00–${h + 1}:00`, [["Cost", usd(v)]]))}></i>`).join("")).join("");
  const busiestWd = wdCost.indexOf(Math.max(...wdCost));
  const hourTotals = Array.from({ length: 24 }, (_, h) => hw.reduce((a, row) => a + row[h], 0));
  const peakHour = hourTotals.indexOf(Math.max(...hourTotals));
  const fmtHour = h => new Date(2026, 0, 1, h).toLocaleTimeString("en-US", { hour: "numeric" });
  const scale = `<div class="scale">Less ${[0, 1, 2, 3, 4].map(i => `<i style="background:var(--heat-${i})"></i>`).join("")} More</div>`;
  return `
    <div class="panel activity">
      <div class="panel-head"><div class="panel-title">${icon("activity")}Activity</div><div class="panel-aside">Daily cost and working hours, last 12 months</div></div>
      <div class="panel-body activity-grid">
        <div class="heat-scroll"><div class="heat-inner">
          <div class="heat-months">${months}</div>
          <div class="heat-wrap"><div class="heat-days">${WEEKDAYS.map((d, i) => `<span>${i % 2 === 0 ? d : ""}</span>`).join("")}</div><div class="heat">${cells}</div></div>
        </div></div>
        <div><div class="hw">${hours}${grid}</div></div>
      </div>
      <div class="activity-foot">${scale}</div>
      <div class="eff four">
        <div><div class="stat-k">Active days</div><div class="stat-v">${active}</div><div class="stat-s">of the last 365</div></div>
        <div><div class="stat-k">Longest streak</div><div class="stat-v">${best} days</div><div class="stat-s">in a row with a session</div></div>
        <div><div class="stat-k">Busiest weekday</div><div class="stat-v">${hasActivity ? WEEKDAYS[busiestWd] : "—"}</div><div class="stat-s">${hasActivity ? usd(wdCost[busiestWd]) + " over the year" : ""}</div></div>
        <div><div class="stat-k">Peak hour</div><div class="stat-v">${hasActivity ? fmtHour(peakHour) : "—"}</div><div class="stat-s">${hasActivity ? "your busiest hour by cost" : ""}</div></div>
      </div>
    </div>`;
}
