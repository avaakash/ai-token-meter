let overviewRecent = [];
// Both overview columns end level: whichever is shorter gets filled with
// real content — more recent sessions on the right (whole rows only), or a
// taller cost chart on the left (it draws to whatever height it's given).
function fillOverview() {
  const grid = $(".g-overview");
  const list = $("#recent-rows");
  if (!grid || !list || !list.firstElementChild?.classList.contains("session-row")) return;
  if (getComputedStyle(grid).gridTemplateColumns.split(" ").length < 2) {
    list.insertAdjacentHTML("beforeend", overviewRecent.slice(3, 5).map(sessionRow).join(""));
    return;
  }
  grid.style.alignItems = "start";
  const [left, right] = [...grid.children].map(c => c.getBoundingClientRect().height);
  grid.style.alignItems = "";
  const rowH = list.firstElementChild.getBoundingClientRect().height;
  // Round up: a partial row's worth of space goes to the chart, which
  // grows to match, rather than staying empty under the list.
  const add = Math.max(0, Math.ceil((left - right) / rowH));
  list.insertAdjacentHTML("beforeend", overviewRecent.slice(3, 3 + add).map(sessionRow).join(""));
}

/* Per-source cost. Sources are told apart by glyph and name, never by hue,
   so the split uses the neutral plan-blue share bar. */
function sourceStats(days, now) {
  return ["claude", "codex"].map(source => ({
    source, ...periodStats(state.data.sessions.filter(x => x.source === source), days, now),
  }));
}

function sourceSplitHTML(stats, total) {
  if (state.source !== "all" || !total) return "";
  return `<div class="src-split">${stats.map(st => `
    <div class="src-row" ${tipAttr(tipRows(SOURCE_LABEL[st.source], [["Cost", usd(st.cost || 0)], ["Share", pct(total ? (st.cost || 0) / total * 100 : 0, 1)], ["Messages", int(st.message_count)], ["Sessions", int(st.sessions)]]))}>
      ${glyph(st.source)}<span class="src-name">${SOURCE_LABEL[st.source]}</span>
      <div class="share-bar"><span data-w="${total ? (st.cost || 0) / total * 100 : 0}%"></span></div>
      <span class="src-val">${usd(st.cost || 0)}</span><span class="src-share">${pct(total ? (st.cost || 0) / total * 100 : 0)}</span>
    </div>`).join("")}</div>`;
}

function sourceCostPanel(st, total, days) {
  const cost = st.cost || 0;
  const typeParts = TOKEN_TYPES.map(([k, label], i) => ({ label, value: st["cost_" + k] || 0, color: SERIES[i], sub: ["Tokens", tokens(st[k + "_tokens"])] }));
  const body = cost ? `
      <div class="cost-figure"><span class="big num" style="font-size:28px">${usd(cost)}</span>${deltaHTML(cost, st.prev_cost, days)}</div>
      <div class="cost-note">${pct(total ? cost / total * 100 : 0)} of the total · ${esc(periodLabel().toLowerCase())}</div>
      ${capacityHTML(typeParts, cost, "src-" + st.source)}
      <div class="cost-stats">
        <div><div class="stat-k">Messages</div><div class="stat-v">${int(st.message_count)}</div></div>
        <div><div class="stat-k">Sessions</div><div class="stat-v">${int(st.sessions)}</div></div>
        <div><div class="stat-k">Per message</div><div class="stat-v">${usd(cost / Math.max(1, st.message_count))}</div></div>
      </div>` : `<div class="empty-state" style="padding:4px 0">No ${SOURCE_LABEL[st.source]} usage in this period.</div>`;
  return `<div class="panel">
    <div class="source-head">${glyph(st.source)}<span class="name">${SOURCE_LABEL[st.source]}</span><span class="aside">${esc(periodLabel())}</span></div>
    <div class="panel-body" style="padding-top:8px">${body}</div>
  </div>`;
}

function emptyCost() {
  return `<div class="empty-state" style="padding:8px 0"><h3>No usage in this period</h3>Costs are worked out from the session logs Claude Code and Codex already write on this Mac. Nothing is uploaded.</div>`;
}

views.limits = () => {
  const shown = sourcesShown();
  const blocks = shown.map(source => {
    const src = state.data.limits[source];
    if (src.status !== "ok") return allowancePanel(source);
    const kinds = [["five_hour", "5-hour window"], ["weekly", "Weekly limit"]].filter(([k]) => src[k]);
    const windows = kinds.map(([k, name]) => {
      const w = src[k];
      const credit = src.credit?.[k];
      const cols = k === "five_hour" ? 5 : 7;
      const vals = w.buckets || Array.from({ length: cols }, () => null);
      const maxB = Math.max(...vals.map(v => v || 0), 0.01);
      const bars = vals.map((v, i) => {
        const t = w.start + i * (k === "five_hour" ? HOUR : DAY);
        const label = k === "five_hour" ? clockTime(t).replace(":00", "") : dayName(t);
        return `<div class="mcol" ${tipAttr(tipRows(k === "five_hour" ? clockTime(t) + "–" + clockTime(t + HOUR) : fullDate(t), [["Cost", v == null ? "—" : usd(v)]]))}><div class="mbar ${v == null ? "future" : ""}" style="height:${v == null ? 2 : Math.max(2, (v / maxB) * 100)}%"></div></div>`;
      }).join("");
      const labels = vals.map((_, i) => { const t = w.start + i * (k === "five_hour" ? HOUR : DAY); return `<span>${esc(k === "five_hour" ? clockTime(t).replace(":00", "") : dayName(t))}</span>`; }).join("");
      const prevDelta = w.prev_cost ? ` <span class="delta">${w.cost > w.prev_cost ? "+" : "−"}${pct(Math.abs((w.cost - w.prev_cost) / w.prev_cost * 100))}</span>` : "";
      return `<div class="window">${meterHTML(name, w, k, src)}
        ${w.buckets ? `<div class="mini">${bars}</div><div class="mini-x">${labels}</div>` : `<div class="note" style="padding:4px 18px 0">${SOURCE_LABEL[source]} reports this window as a rolling 7 days, so there's no per-day split.</div>`}
        <div class="window-facts">
          <div><div class="stat-k">Previous window</div><div class="stat-v">${w.prev_cost ? usd(w.prev_cost) : "No usage"}${prevDelta}</div></div>
          <div><div class="stat-k">Full allowance, at API rates</div><div class="stat-v">${credit?.available ? "≈ " + usd(credit.total) : credit ? `<span class="muted" style="font-weight:500">After ${credit.needed - credit.points} more syncs</span>` : "—"}</div></div>
        </div></div>`;
    }).join("");
    const onlyWeekly = !src.five_hour ? " · weekly window only on this plan" : "";
    return `<div class="panel"><div class="source-head">${glyph(source)}<span class="name">${SOURCE_LABEL[source]}</span><span class="plan">${esc((src.plan || "") + onlyWeekly)}</span><span class="aside">${esc(syncAside(src))}</span></div>
      <div class="window-grid ${kinds.length === 1 ? "single" : ""}">${windows}</div></div>`;
  }).join("");

  const forecasts = shown.map(source => {
    const src = state.data.limits[source];
    if (src.status !== "ok" || !src.forecast || !src.weekly) return "";
    const fc = src.forecast, w = src.weekly;
    const highRaw = fc.projected_raw > 100 ? Math.max(fc.projected_raw, fc.high) : fc.high;
    const scaleMax = highRaw > 100 ? Math.ceil(highRaw / 10) * 10 + 10 : 100;
    const at = v => (Math.min(v, scaleMax) / scaleMax) * 100;
    const runsOut = fc.exhaustion_at && fc.exhaustion_at < w.end;
    const weeks = src.history.map((v, i) => ({ v, label: shortDate(w.start - (src.history.length - i) * 7 * DAY) }));
    weeks.push({ v: w.pct, label: "This week", current: true });
    return `<div class="grid g-2">
      <div class="panel">
        <div class="panel-head"><div class="panel-title">${glyph(source)}${SOURCE_LABEL[source]} weekly forecast</div><div class="panel-aside">${fc.method === "shape" ? `Based on your last ${fc.reference_weeks} weeks` : "Straight-line estimate"}</div></div>
        <div class="panel-body">
          <div class="cost-figure"><span class="big num">${pct(fc.projected_raw > 100 ? fc.projected_raw : fc.projected)}</span><span class="delta"><span class="vs">projected at reset · now ${pct(w.pct)}</span></span></div>
          <div class="range-bar" ${tipAttr(tipRows("Projected at reset", [["Likely", pct(fc.projected_raw)], ["Range", pct(fc.low) + "–" + pct(highRaw)], ["Now", pct(w.pct)]]))}>
            <div class="rb-track"></div>
            <div class="rb-band" style="left:${at(fc.low)}%;width:${at(highRaw) - at(fc.low)}%"></div>
            <div class="rb-now" style="left:${at(w.pct)}%"></div>
            <div class="rb-mid" style="left:${at(fc.projected_raw)}%"></div>
            <div class="rb-limit" style="left:${at(100)}%"></div>
          </div>
          <div class="range-labels"><span style="left:${at(w.pct)}%">Now</span>${Math.abs(at(fc.projected_raw) - at(100)) > 8 ? `<span style="left:${at(100)}%">Limit</span>` : ""}<span style="left:${at(fc.projected_raw)}%">Likely</span></div>
          <div class="kv" style="margin-top:12px">
            <dt>Runs out</dt><dd>${runsOut ? `<b>${esc(resetLabel(fc.exhaustion_at))}</b>${fc.earliest && fc.latest ? ` <span class="muted">(${esc(resetLabel(fc.earliest))} – ${esc(resetLabel(fc.latest))})</span>` : ""}` : "Not at this pace"}</dd>
            <dt>Resets</dt><dd>${esc(resetLabel(w.end))} <span class="muted">· in ${esc(duration(w.end - Date.now()))}</span></dd>
            <dt>Burn rate</dt><dd>${pct(fc.burn_per_day, 1)} of the limit per day</dd>
            ${fc.typical_error ? `<dt>Accuracy</dt><dd>Usually within ±${fc.typical_error.toFixed(0)} points by this point in the week</dd>` : ""}
          </div>
          ${fc.method === "shape" ? "" : `<p class="note" style="margin:12px 0 0">Scales today's usage by the time elapsed. It sharpens after three full weeks of history.</p>`}
        </div>
      </div>
      <div class="panel weeks-panel">
        <div class="panel-head"><div class="panel-title">${SOURCE_LABEL[source]} past weeks</div><div class="panel-aside">Peak usage per week</div></div>
        <div class="panel-body" style="padding-top:18px">
          <div class="weeks">${weeks.map(k => `<div class="wk ${k.current ? "current" : ""}" ${tipAttr(tipRows(k.current ? "This week so far" : "Week of " + k.label, [["Peak", pct(k.v)]]))}><span class="wk-val">${Math.round(k.v)}%</span><div class="wk-bar"><span style="height:${Math.min(100, k.v)}%"></span></div><span class="wk-label">${esc(k.label)}</span></div>`).join("")}</div>
        </div>
      </div>
    </div>`;
  }).join("");

  const synced = shown.map(s => state.data.limits[s]).filter(s => s.status === "ok");
  return viewHead("Limits", synced.length ? "Reported by the providers themselves · synced every 10 minutes" : "Not synced yet") + blocks + forecasts;
};

views.cost = () => {
  const now = Date.now(), days = periodDays();
  const sessions = sessionsForSource();
  const p = periodStats(sessions, days, now);
  const total = p.cost || 0;
  const series = seriesForPeriod(sessions, days, now);
  const typeParts = TOKEN_TYPES.map(([k, label], i) => ({ label, value: p["cost_" + k] || 0, color: SERIES[i], sub: ["Tokens", tokens(p[k + "_tokens"])] }));
  const modelParts = foldParts(p.by_model, m => m.model, 6);
  const daily = dailySeries(sessions, days, now).filter(d => d.cost > 0);
  const top = daily.reduce((a, d) => (d.cost > (a?.cost || 0) ? d : a), null);
  const longest = sessions.filter(s => s.start_ts >= now - days * DAY).reduce((a, s) => (s.end_ts - s.start_ts > (a ? a.end_ts - a.start_ts : -1) ? s : a), null);
  const promptTokens = (p.input_tokens || 0) + (p.cache_read_tokens || 0) + (p.cache_write_tokens || 0);
  const perSource = sourceStats(days, now);
  if (!total) return viewHead("Cost", esc(periodLabel()), periodSeg()) + `<div class="panel"><div class="panel-body">${emptyCost()}</div></div>`;
  return viewHead("Cost", "API-equivalent: what this usage would cost at published API rates", periodSeg()) + `
    <div class="grid g-3-2">
      <div class="panel">
        <div class="panel-head"><div class="panel-title">${esc(periodLabel())}</div><div class="panel-aside">${state.source === "all" ? "By source" : "By token type"}</div></div>
        <div class="panel-body">
          <div class="cost-figure"><span class="big num">${usd(total)}</span>${deltaHTML(total, p.prev_cost, days)}</div>
          ${state.source === "all" ? sourceSplitHTML(perSource, total) : capacityHTML(typeParts, total, "cost-types")}
          <div class="cost-stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">
            <div><div class="stat-k">Cache hit rate</div><div class="stat-v">${pct(promptTokens ? p.cache_read_tokens / promptTokens * 100 : 0, 1)}</div></div>
            <div><div class="stat-k">Saved by caching</div><div class="stat-v">${usd(Math.max(0, p.cost_no_cache - p.cost))}</div></div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="panel-title">By model</div><button class="link-btn" data-go="models">All models</button></div>
        <div class="panel-body" style="padding-top:2px">${capacityHTML(modelParts, total, "cost-models")}</div>
      </div>
    </div>
    ${state.source === "all" ? `<div class="grid g-2">${perSource.map(st => sourceCostPanel(st, total, days)).join("")}</div>` : ""}
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Cost per ${series.unit}, by token type</div><div class="panel-aside">${esc(periodLabel())}</div></div>
      <div class="panel-body">
        ${chartSlot({
          items: series.items, height: 220,
          keys: TOKEN_TYPES.map(([k, label], i) => ["cost_" + k, label, SERIES[i]]),
          labelOf: it => shortDate(it.t),
          tipOf: it => tipRows(series.unit === "day" ? fullDate(it.t) : "Week of " + shortDate(it.t),
            [...TOKEN_TYPES.map(([k, label], i) => [label, usd(it["cost_" + k]), SERIES[i]]).reverse(), ["Total", usd(it.cost)]]),
        })}
        <div class="chart-legend">${TOKEN_TYPES.map(([, label], i) => `<span><i style="background:var(${SERIES[i]})"></i>${label}</span>`).join("")}</div>
      </div>
    </div>
    <div class="panel eff four">
      <div><div class="stat-k">Per message</div><div class="stat-v">${usd(total / Math.max(1, p.message_count))}</div><div class="stat-s">${int(p.message_count)} messages</div></div>
      <div><div class="stat-k">Per session</div><div class="stat-v">${usd(total / Math.max(1, p.sessions))}</div><div class="stat-s">${int(p.sessions)} sessions</div></div>
      <div><div class="stat-k">Busiest day</div><div class="stat-v">${top ? usd(top.cost) : "—"}</div><div class="stat-s">${top ? esc(fullDate(top.t)) : ""}</div></div>
      <div><div class="stat-k">Longest session</div><div class="stat-v">${longest ? esc(duration(longest.end_ts - longest.start_ts)) : "—"}</div><div class="stat-s" title="${longest ? esc(sessionName(longest).text) : ""}">${longest ? esc(sessionName(longest).text) : ""}</div></div>
    </div>`;
};

function quantileLevels(values) {
  const nz = values.filter(v => v > 0).sort((a, b) => a - b);
  const q = f => nz[Math.min(nz.length - 1, Math.floor(nz.length * f))] || 0;
  const cuts = [q(0.25), q(0.55), q(0.85)];
  return v => (v <= 0 ? 0 : v <= cuts[0] ? 1 : v <= cuts[1] ? 2 : v <= cuts[2] ? 3 : 4);
}

function activityPanel() {
  const now = Date.now();
  const sessions = sessionsForSource();
  const today = startOfDay(now);
  let start = today - 364 * DAY;
  start -= ((new Date(start).getDay() + 6) % 7) * DAY;
  const byDay = new Map();
  const hw = Array.from({ length: 7 }, () => new Array(24).fill(0));
  const wdCost = new Array(7).fill(0);
  for (const s of sessions) {
    if (s.start_ts < start) continue;
    const k = dayKey(s.start_ts);
    const e = byDay.get(k) || { cost: 0, message_count: 0, sessions: 0 };
    e.cost += s.cost; e.message_count += s.message_count; e.sessions += 1;
    byDay.set(k, e);
    const d = new Date(s.start_ts), wd = (d.getDay() + 6) % 7;
    hw[wd][d.getHours()] += s.cost;
    wdCost[wd] += s.cost;
  }
  const lv = quantileLevels([...byDay.values()].map(e => e.cost));
  let cells = "", months = "", lastMonth = -1, col = 0, active = 0, streak = 0, best = 0;
  const cols = Math.ceil((today - start) / DAY / 7) + 1;
  for (let t = start; t <= today + 6 * DAY; t += DAY) {
    const d = new Date(t), wd = (d.getDay() + 6) % 7;
    if (wd === 0) {
      if (d.getMonth() !== lastMonth && t <= today) { months += `<span style="left:${(col / cols) * 100}%">${MONTHS[d.getMonth()]}</span>`; lastMonth = d.getMonth(); }
      col++;
    }
    if (t > today) { cells += `<i class="out"></i>`; continue; }
    const e = byDay.get(dayKey(t));
    if (e) { active++; streak++; best = Math.max(best, streak); } else streak = 0;
    cells += `<i style="background:var(--heat-${lv(e?.cost || 0)})" ${tipAttr(tipRows(fullDate(t), e ? [["Cost", usd(e.cost)], ["Messages", int(e.message_count)], ["Sessions", int(e.sessions)]] : [["No activity", ""]]))}></i>`;
  }
  const hwLv = quantileLevels(hw.flat());
  const hours = `<span></span>` + Array.from({ length: 24 }, (_, h) => `<span class="hl">${h % 3 === 0 ? (h === 0 ? "12a" : h < 12 ? h + "a" : h === 12 ? "12p" : h - 12 + "p") : ""}</span>`).join("");
  const grid = WEEKDAYS.map((wd, r) => `<span>${wd}</span>` + hw[r].map((v, h) => `<i style="background:var(--heat-${hwLv(v)})" ${tipAttr(tipRows(`${wd} ${h}:00–${h + 1}:00`, [["Cost", usd(v)]]))}></i>`).join("")).join("");
  const busiestWd = wdCost.indexOf(Math.max(...wdCost));
  const hourTotals = Array.from({ length: 24 }, (_, h) => hw.reduce((a, row) => a + row[h], 0));
  const peakHour = hourTotals.indexOf(Math.max(...hourTotals));
  const fmtHour = h => new Date(2026, 0, 1, h).toLocaleTimeString("en-US", { hour: "numeric" });
  const scale = `<div class="scale">Less ${[0, 1, 2, 3, 4].map(i => `<i style="background:var(--heat-${i})"></i>`).join("")} More</div>`;
  return `
    <div class="panel activity">
      <div class="panel-head"><div class="panel-title">${icon("activity")}Activity</div><div class="panel-aside">Daily cost and working hours, last 12 months</div></div>
      <div class="panel-body activity-grid">
        <div class="heat-scroll"><div class="heat-inner">
          <div class="heat-months">${months}</div>
          <div class="heat-wrap"><div class="heat-days">${WEEKDAYS.map((d, i) => `<span>${i % 2 === 0 ? d : ""}</span>`).join("")}</div><div class="heat">${cells}</div></div>
        </div></div>
        <div><div class="hw">${hours}${grid}</div></div>
      </div>
      <div class="activity-foot">${scale}</div>
      <div class="eff four">
        <div><div class="stat-k">Active days</div><div class="stat-v">${active}</div><div class="stat-s">of the last 365</div></div>
        <div><div class="stat-k">Longest streak</div><div class="stat-v">${best} days</div><div class="stat-s">in a row with a session</div></div>
        <div><div class="stat-k">Busiest weekday</div><div class="stat-v">${sessions.length ? WEEKDAYS[busiestWd] : "—"}</div><div class="stat-s">${sessions.length ? usd(wdCost[busiestWd]) + " total" : ""}</div></div>
        <div><div class="stat-k">Peak hour</div><div class="stat-v">${sessions.length ? fmtHour(peakHour) : "—"}</div><div class="stat-s">${sessions.length ? "most sessions start then" : ""}</div></div>
      </div>
    </div>`;
}

const SORTS = { end_ts: s => s.end_ts, cost: s => s.cost, message_count: s => s.message_count, tokens: s => s.input_tokens + s.output_tokens + s.cache_read_tokens + s.cache_write_tokens, name: s => sessionName(s).text.toLowerCase() };

views.sessions = () => {
  const q = state.query.trim().toLowerCase();
  let list = sessionsForSource();
  if (q) list = list.filter(s => [sessionName(s).text, s.project, s.cwd, s.session_id, s.models].some(v => String(v).toLowerCase().includes(q)));
  const key = SORTS[state.sort.key];
  list = [...list].sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * state.sort.dir; });
  const th = (k, label, cls = "") => {
    const on = state.sort.key === k;
    return `<th class="sortable ${cls}" data-sort="${k}" ${on ? `aria-sort="${state.sort.dir > 0 ? "ascending" : "descending"}"` : ""}>${label}<span class="arrow">${on ? `<svg class="icon" style="width:12px;height:12px;vertical-align:-2px;${state.sort.dir > 0 ? "transform:rotate(180deg)" : ""}" aria-hidden="true"><use href="#i-chevron"/></svg>` : ""}</span></th>`;
  };
  const rows = list.slice(0, state.limit).map(s => {
    const n = sessionName(s);
    return `<tr data-session="${esc(s.session_id)}" aria-selected="${state.selected === s.session_id}">
      <td class="name-cell"><div class="s-name ${n.kind === "untitled" ? "untitled" : ""}">${n.html}</div><div class="s-meta">${esc(s.project)} · ${esc(s.models.split(",").join(", "))}</div></td>
      <td class="hide-sm"><span class="src">${glyph(s.source)}${SOURCE_LABEL[s.source]}</span></td>
      <td class="r">${esc(ago(s.end_ts))}</td>
      <td class="r hide-sm">${int(s.message_count)}</td>
      <td class="r hide-sm">${tokens(SORTS.tokens(s))}</td>
      <td class="r"><b>${usd(s.cost)}</b></td>
    </tr>`;
  }).join("");
  const selected = state.selected && state.data.sessions.find(s => s.session_id === state.selected);
  const table = `<div class="panel"><div class="table-wrap"><table class="data">
    <thead><tr>${th("name", "Session")}<th class="hide-sm">Source</th>${th("end_ts", "Last active", "r")}${th("message_count", "Messages", "r hide-sm")}${th("tokens", "Tokens", "r hide-sm")}${th("cost", "Cost", "r")}</tr></thead>
    <tbody>${rows || `<tr><td colspan="6"><div class="empty-state">${q ? `No sessions match “${esc(state.query)}”.` : "No sessions yet."}</div></td></tr>`}</tbody>
  </table></div>${list.length > state.limit ? `<div class="more-row"><button class="link-btn" data-more>Show ${Math.min(40, list.length - state.limit)} more</button></div>` : ""}</div>`;
  return viewHead("Sessions", `${int(list.length)} ${q ? "matching" : "sessions"} · all time`) + `
    <div class="toolbar">
      <label class="search">${icon("search")}<input id="session-q" type="search" placeholder="Search names, projects, paths or IDs" value="${esc(state.query)}" autocomplete="off" spellcheck="false"></label>
    </div>
    <div class="sessions-layout ${selected ? "with-inspector" : ""}">${table}${selected ? inspector(selected) : ""}</div>`;
};

function inspector(s) {
  const n = sessionName(s);
  const parts = TOKEN_TYPES.map(([k, label], i) => ({ label, value: s["cost_" + k] || 0, color: SERIES[i], sub: ["Tokens", tokens(s[k + "_tokens"])] }));
  return `<aside class="panel inspector" aria-label="Session details">
    <div class="panel-head" style="align-items:flex-start"><div style="min-width:0"><h2 class="insp-title">${n.html}</h2>
      <div class="insp-sub">${SOURCE_LABEL[s.source]} · ${esc(s.project)}${n.kind === "prompt" ? " · named from its first prompt" : ""}</div></div>
      <button class="close" data-close aria-label="Close details">${icon("close")}</button></div>
    <div class="panel-body">
      <div class="cost-figure"><span class="big num" style="font-size:28px">${usd(s.cost)}</span></div>
      ${capacityHTML(parts, s.cost, "insp")}
      <dl class="kv" style="margin-top:16px">
        <dt>Session ID</dt><dd><span class="mono">${esc(s.session_id.slice(0, 18))}…</span><button class="copy" data-copy="${esc(s.session_id)}">Copy</button></dd>
        <dt>Started</dt><dd>${esc(fullDate(s.start_ts))}, ${esc(clockTime(s.start_ts))}</dd>
        <dt>Duration</dt><dd>${esc(duration(s.end_ts - s.start_ts))}</dd>
        <dt>Messages</dt><dd>${int(s.message_count)}</dd>
        <dt>Folder</dt><dd class="mono">${esc(s.cwd)}</dd>
      </dl>
      <div class="side-label" style="margin:16px 0 4px">Models</div>
      <div class="rows">${s.by_model.map(m => `<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:12.5px"><span>${esc(m.model)}</span><span class="num"><b>${usd(m.cost)}</b> <span class="muted">· ${int(m.message_count)} msgs</span></span></div>`).join("")}</div>
    </div>
  </aside>`;
}

function shareList(items, nameOf, metaOf, emptyText) {
  const total = items.reduce((a, m) => a + m.cost, 0);
  if (!items.length) return `<div class="panel"><div class="empty-state">${emptyText}</div></div>`;
  return `<div class="panel rows">${items.map(m => `
    <div class="list-row share-row" ${tipAttr(tipRows(nameOf(m).text, [["Cost", usd(m.cost)], ["Share", pct(m.cost / total * 100, 1)], ["Messages", int(m.message_count)], ["Sessions", int(m.sessions)]]))}>
      <div style="min-width:0"><div class="s-name" style="display:flex;align-items:center;gap:8px">${nameOf(m).html}</div><div class="share-meta">${metaOf(m)}</div></div>
      <div class="share-bar-cell"><div class="share-bar"><span data-w="${(m.cost / items[0].cost) * 100}%"></span></div></div>
      <div style="text-align:right"><div class="s-cost">${usd(m.cost)}</div><div class="s-when">${pct(m.cost / total * 100)} of total</div></div>
    </div>`).join("")}</div>`;
}

views.projects = () => {
  const p = periodStats(sessionsForSource(), periodDays(), Date.now());
  return viewHead("Projects", `${p.by_project.length} with usage · ${esc(periodLabel().toLowerCase())}`, periodSeg()) +
    shareList(p.by_project, m => ({ text: m.project, html: `${icon("folder")}${esc(m.project)}` }),
      m => `${esc(m.cwd)} · ${int(m.sessions)} sessions · mostly ${esc(Object.entries(m.models).sort((a, b) => b[1] - a[1])[0][0])}`,
      "No project activity in this period.");
};

views.models = () => {
  const p = periodStats(sessionsForSource(), periodDays(), Date.now());
  return viewHead("Models", `${p.by_model.length} used · ${esc(periodLabel().toLowerCase())}`, periodSeg()) +
    shareList(p.by_model, m => ({ text: m.model, html: `${glyph(m.source)}${esc(m.model)}` }),
      m => { const prompt = m.input_tokens + m.cache_read_tokens + m.cache_write_tokens; return `${tokens(prompt + m.output_tokens)} tokens · ${pct(prompt ? m.cache_read_tokens / prompt * 100 : 0)} from cache · ${int(m.message_count)} messages`; },
      "No model usage in this period.");
};

/* ===================== Shell ===================== */
function renderSidebar() {
  document.querySelectorAll("#source-seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.source === state.source));
  document.querySelectorAll("#theme-seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.theme === state.theme));
  document.querySelectorAll(".nav a").forEach(a => {
    if (a.dataset.view === state.view) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  $("#scenario").value = state.scenario;
  $("#nav-session-count").textContent = sessionsForSource().length ? int(sessionsForSource().length) : "";
  const levels = sourcesShown().map(s => state.data.limits[s]).filter(s => s.status === "ok").flatMap(s => {
    const out = [s.five_hour?.pct, s.weekly?.pct].filter(v => v != null).map(level);
    if (s.forecast?.exhaustion_at && s.weekly && s.forecast.exhaustion_at < s.weekly.end) out.push("crit");
    return out;
  });
  const alert = $("#nav-limit-alert");
  alert.hidden = !levels.some(l => l !== "ok");
  alert.className = "nav-alert" + (levels.includes("crit") ? "" : " warn");
  alert.title = levels.includes("crit") ? "A limit is about to run out" : "A limit is above 75%";
  const lines = ["claude", "codex"].map(s => {
    const src = state.data.limits[s];
    const text = src.status === "ok" ? `${SOURCE_LABEL[s]} · synced ${ago(src.synced_at)}` : src.status === "missing" ? `${SOURCE_LABEL[s]} · not installed` : `${SOURCE_LABEL[s]} · not synced yet`;
    return `<div class="sync-line"><span class="dot ${src.status === "ok" ? "" : "off"}"></span>${esc(text)}</div>`;
  }).join("");
  $("#sync").innerHTML = lines + `<button class="sync-btn" id="sync-btn">${icon("sync")}Sync now</button>`;
}

function render() {
  tips.clear();
  charts.length = 0;
  renderSidebar();
  document.querySelectorAll(".view").forEach(v => { v.hidden = v.dataset.view !== state.view; });
  const el = $("#view-" + state.view);
  el.innerHTML = views[state.view]();
  if (state.view === "overview") fillOverview();
  // On narrow screens the year heatmap scrolls; open it on the latest weeks.
  el.querySelectorAll(".heat-scroll").forEach(h => { h.scrollLeft = h.scrollWidth; });
  drawCharts();
  settle(el);
}

function go(view) {
  if (!views[view]) view = "overview";
  if (location.hash !== "#" + view) history.replaceState(null, "", "#" + view);
  state.view = view;
  render();
  $("#main").scrollTop = 0;
  window.scrollTo(0, 0);
}

function applyTheme() {
  if (state.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", state.theme);
}

document.addEventListener("click", e => {
  const t = e.target;
  const navLink = t.closest(".nav a");
  if (navLink) { e.preventDefault(); go(navLink.dataset.view); return; }
  const goBtn = t.closest("[data-go]");
  if (goBtn) { go(goBtn.dataset.go); return; }
  const periodBtn = t.closest("[data-period]");
  if (periodBtn) { state.period = periodBtn.dataset.period; save("usage-period", state.period); render(); return; }
  const srcBtn = t.closest("[data-source]");
  if (srcBtn) { state.source = srcBtn.dataset.source; save("usage-source", state.source); state.selected = null; render(); return; }
  const themeBtn = t.closest("[data-theme]");
  if (themeBtn && themeBtn.closest("#theme-seg")) { state.theme = themeBtn.dataset.theme; save("usage-theme", state.theme); applyTheme(); renderSidebar(); return; }
  if (t.closest("#sync-btn")) {
    const btn = t.closest("#sync-btn");
    btn.classList.add("spinning"); btn.disabled = true;
    setTimeout(() => {
      for (const s of Object.values(state.data.limits)) if (s.status === "ok") s.synced_at = Date.now();
      render();
    }, 900);
    return;
  }
  const sort = t.closest("th[data-sort]");
  if (sort) {
    const k = sort.dataset.sort;
    state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: k === "name" ? 1 : -1 };
    render(); return;
  }
  if (t.closest("[data-more]")) { state.limit += 40; render(); return; }
  if (t.closest("[data-close]")) { state.selected = null; render(); return; }
  const copy = t.closest("[data-copy]");
  if (copy) {
    navigator.clipboard?.writeText(copy.dataset.copy).then(() => { copy.textContent = "Copied"; setTimeout(() => { copy.textContent = "Copy"; }, 1400); }, () => {});
    return;
  }
  const row = t.closest("[data-session]");
  if (row) {
    state.selected = row.dataset.session;
    if (state.view !== "sessions") { state.query = ""; go("sessions"); } else render();
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "session-q") {
    state.query = e.target.value;
    state.limit = 40;
    const pos = e.target.selectionStart;
    render();
    const input = $("#session-q");
    input.focus();
    input.setSelectionRange(pos, pos);
  }
});

$("#scenario").addEventListener("change", e => {
  state.scenario = e.target.value;
  save("usage-scenario", state.scenario);
  state.data = generateSample(state.scenario);
  state.selected = null;
  render();
});

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (state.theme === "auto") render(); });
addEventListener("hashchange", () => go(location.hash.slice(1)));

applyTheme();
state.data = generateSample(state.scenario);
go(location.hash.slice(1) || "overview");
// The real page refreshes every 60s; the sample just keeps its "ago" labels honest.
setInterval(render, 60000);
</script>
</body>
</html>
