name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Run checks
        run: swift run --package-path macpapp usage-core-checks

      - name: Build universal app and DMG
        run: VERSION="${TAG#v}" ./build.sh --dmg

      - name: Checksum
        run: cd build && shasum -a 256 TokenMeter.dmg > TokenMeter.dmg.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/TokenMeter.dmg build/TokenMeter.dmg.sha256 --clobber
          else
            gh release create "$TAG" build/TokenMeter.dmg build/TokenMeter.dmg.sha256 \
              --title "Token Meter ${TAG#v}" --generate-notes
          fi
