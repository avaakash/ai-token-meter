name: CI

# Manual only for now: Actions → CI → Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run checks
        run: swift run --package-path macpapp usage-core-checks
      - name: Build universal app
        run: ./build.sh
